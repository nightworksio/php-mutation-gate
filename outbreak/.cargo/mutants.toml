# Every skip is written here with its reason beside it (ADR-0118).
test_tool = "nextest"
additional_cargo_test_args = ["--profile", "mutants"]
minimum_test_timeout = 15
exclude_globs = [
  # outbreak.so's compiling and reading of op arrays and state, and its hooks
  # into the engine, run only inside PHP: the boundary's contract suite holds
  # them, not the Rust suite.
  "crates/outbreak-ext/src/{engine,lib,program,state,value}.rs",
  # Built off Unix alone, where no job runs the tests. Judging them needs a
  # Windows job that runs the workspace's tests and cargo-mutants.
  "crates/outbreak/src/elsewhere.rs",
  "crates/outbreak-ext/src/steps/elsewhere.rs",
  # Built where the platform has no notifications the daemon reads: neither
  # Linux, macOS nor the BSDs. Judging them needs a job on such a platform,
  # Windows, that runs the workspace's tests and cargo-mutants.
  "crates/outbreak-serve/src/power/elsewhere.rs",
  "crates/outbreak-serve/src/watching/elsewhere.rs",
  # Built on macOS (and the BSDs) alone: the `mutants macos` job judges them,
  # by .cargo/mutants-macos.toml.
  "crates/outbreak-serve/src/power/macos.rs",
  "crates/outbreak-serve/src/watching/kqueue.rs",
]
exclude_re = [
  # libc defines PROT_READ (0x1) and PROT_WRITE (0x2), and MAP_SHARED (0x01)
  # and MAP_ANON (0x20 on Linux), each as a single bit of its own: two
  # values that share no bit give the same with ^ as with |.
  'crates/outbreak-ext/src/steps\.rs:.*: replace \| with \^ in mapped$',
  # mmap(2) on Linux, where the shards run, ignores the descriptor of a
  # MAP_ANONYMOUS mapping, so -1 and 1 map the same fresh pages.
  'crates/outbreak-ext/src/steps\.rs:.*: delete - in mapped$',
  # Each inotify flag joined here is a single bit of its own: IN_MODIFY (0x2),
  # IN_CLOSE_WRITE (0x8), IN_MOVED_FROM (0x40), IN_MOVED_TO (0x80), IN_CREATE
  # (0x100), IN_DELETE (0x200), IN_DELETE_SELF (0x400), IN_MOVE_SELF (0x800),
  # IN_ONLYDIR (0x1000000), IN_DONT_FOLLOW (0x2000000); IN_CLOEXEC (0o2000000)
  # and IN_NONBLOCK (0o4000). Values that share no bit give the same with ^ as
  # with |.
  'crates/outbreak-serve/src/watching\.rs:.*: replace \| with \^ in inotify::(mask|Inotify::armed|Batch::took)$',
  # SOCK_CLOEXEC (0o2000000) and SOCK_NONBLOCK (0o4000) share no bit, and
  # neither do O_NOFOLLOW (0o400000) and O_NONBLOCK (0o4000): ^ gives the
  # same as |.
  'crates/outbreak-serve/src/power\.rs:.*: replace \| with \^ in uevents::Uevents::bound$',
  'crates/outbreak-serve/src/server\.rs:.*: replace \| with \^ in opened$',
  # poll(2) reports POLLERR whether it is asked for or not, and the kernel
  # raises POLLERR with POLLPRI on a sysfs attribute's change: asking for
  # POLLPRI | POLLERR, for neither (&) or for both (^) wakes alike.
  'crates/outbreak-serve/src/power\.rs:.*: replace \| with [&^] in uevents::<impl Notices for Uevents>::next$',
]
