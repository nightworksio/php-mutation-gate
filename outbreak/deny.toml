# What Outbreak may depend on (ADR-0118), as herald's deny.toml holds it: no
# advisory, no yanked crate, one version of each crate, no wildcard, only the
# licenses below, only crates.io, and no crate that reports on the person
# running it or runs code it was handed; libloading only as clang-sys loads
# libclang in the build of outbreak.so.
[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Second versions only the build of outbreak.so or ring hold: ext-php-rs's
# build script takes thiserror 1 through skeptic, and syn 2 through skeptic,
# openssl-macros and zip's zeroize; ring, the TLS of ureq, takes getrandom
# 0.2 where cc's jobserver takes 0.4.
skip = [
  { crate = "getrandom@0.2.17", reason = "ring's, the TLS of ureq; cc's jobserver takes 0.4" },
  { crate = "syn@2.0.119", reason = "ext-php-rs's build script, through skeptic, openssl-macros and zip" },
  { crate = "thiserror@1.0.69", reason = "ext-php-rs's build script, through skeptic" },
  { crate = "thiserror-impl@1.0.69", reason = "ext-php-rs's build script, through skeptic" },
]
deny = [
  { crate = "amplitude", reason = "reports on the person running it" },
  { crate = "aptabase", reason = "reports on the person running it" },
  { crate = "bugsnag", reason = "reports on the person running it" },
  { crate = "countly", reason = "reports on the person running it" },
  { crate = "datadog", reason = "reports on the person running it" },
  { crate = "google-analytics", reason = "reports on the person running it" },
  { crate = "libhoney", reason = "reports on the person running it" },
  { crate = "mixpanel", reason = "reports on the person running it" },
  { crate = "opentelemetry", reason = "reports on the person running it" },
  { crate = "posthog", reason = "reports on the person running it" },
  { crate = "rollbar", reason = "reports on the person running it" },
  { crate = "segment", reason = "reports on the person running it" },
  { crate = "sentry", reason = "reports on the person running it" },
  { crate = "snowplow", reason = "reports on the person running it" },
  { crate = "abi_stable", reason = "runs code it was handed" },
  { crate = "dlopen", reason = "runs code it was handed" },
  { crate = "libloading", reason = "runs code it was handed", wrappers = ["clang-sys"] },
  { crate = "sharedlib", reason = "runs code it was handed" },
  { crate = "boa_engine", reason = "runs code it was handed" },
  { crate = "deno_core", reason = "runs code it was handed" },
  { crate = "dyon", reason = "runs code it was handed" },
  { crate = "extism", reason = "runs code it was handed" },
  { crate = "gluon", reason = "runs code it was handed" },
  { crate = "hlua", reason = "runs code it was handed" },
  { crate = "koto", reason = "runs code it was handed" },
  { crate = "lua", reason = "runs code it was handed" },
  { crate = "mlua", reason = "runs code it was handed" },
  { crate = "quickjs", reason = "runs code it was handed" },
  { crate = "rhai", reason = "runs code it was handed" },
  { crate = "rlua", reason = "runs code it was handed" },
  { crate = "rquickjs", reason = "runs code it was handed" },
  { crate = "rustpython", reason = "runs code it was handed" },
  { crate = "starlark", reason = "runs code it was handed" },
  { crate = "v8", reason = "runs code it was handed" },
  { crate = "wasm3", reason = "runs code it was handed" },
  { crate = "wasmedge", reason = "runs code it was handed" },
  { crate = "wasmer", reason = "runs code it was handed" },
  { crate = "wasmi", reason = "runs code it was handed" },
  { crate = "wasmtime", reason = "runs code it was handed" },
]
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# LLVM's libFuzzer, which the fuzz targets alone link; no build of outbreak
# ships it. zip's bzip2 and PPMd, which ext-php-rs's build script links only
# where it runs on a Windows host, and no build of outbreak.so runs there.
exceptions = [
  { crate = "libfuzzer-sys", allow = ["NCSA"] },
  { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
  { crate = "ppmd-rust", allow = ["MIT-0"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
