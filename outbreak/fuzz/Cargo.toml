[package]
name = "outbreak-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
outbreak-cache = { path = "../crates/outbreak-cache" }
outbreak-map = { path = "../crates/outbreak-map" }
outbreak-report = { path = "../crates/outbreak-report" }

[workspace]
members = ["."]

[[bin]]
name = "map"
path = "fuzz_targets/map.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "slice"
path = "fuzz_targets/slice.rs"
test = false
doc = false
bench = false

[[bin]]
name = "report"
path = "fuzz_targets/report.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pack"
path = "fuzz_targets/pack.rs"
test = false
doc = false
bench = false
