# Spelling, for the `typos` job in .github/workflows/hygiene.yml.

[files]
# Hidden files are read, so `.docs`, `.github` and `.githooks` are checked.
# `.git` holds compressed objects rather than text, so it comes back out.
ignore-hidden = false
# The vendored viewer is minified, the fixtures are other projects' schemas,
# and the docs site's packages, lock and build are not its own writing.
extend-exclude = [".git/", "vendor/", "composer.lock", "tests/Fixtures/", ".site/node_modules/", ".site/dist/", ".site/.astro/", ".site/package-lock.json"]

[default]
# A mutant's id is twelve hex digits, read as words where it starts with letters.
extend-ignore-re = ['"mutant": "[0-9a-f]{12}"']

[default.extend-identifiers]
# Pest's own expectation is spelled this way, and the stub mirrors its API.
toBeInvokable = "toBeInvokable"
