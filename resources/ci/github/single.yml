# Written by `mutation-gate init --ci=github`, for the gate %%version%%.
# Require the check `%%check%%` in the default branch's protection rule.
# The first job runs the project's tests, so it holds no token and no
# secret: what needs one, the pull request comment and the ledger a store
# keeps, it leaves for `deliver`, a job of its own that runs none of the
# project's code. For an S3 proof store, add AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY as secrets of the environment %%keys%%,
# whose deployment branches are %%branch%% alone, and name the store in the
# repository's variables MUTATION_GATE_STORE and its location; Azure and GCS
# sign in through GitHub's OIDC from the variables below. A branch can edit
# this file, so the keys' protection is the environment's restriction to
# %%branch%%, not the condition below.
name: mutation

on:
  pull_request:
  push:
    branches: ['%%branch%%']
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: '%%check%%'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nightworksio/php-mutation-gate@%%pin%%
        with:
          php-version: '%%php%%'
          # Every unit on a schedule or a manual run, what changed otherwise.
          mode: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && 'full' || 'changed' }}
          runner: '%%runner%%'

  deliver:
    name: mutation / deliver
    needs: mutation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/%%branch%%' && '%%keys%%' || '' }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: nightworksio/php-mutation-gate@%%pin%%
        env:
          MUTATION_GATE_DEFAULT_BRANCH: '%%branch%%'
          MUTATION_GATE_STORE: ${{ vars.MUTATION_GATE_STORE }}
          MUTATION_GATE_STORE_BUCKET: ${{ vars.MUTATION_GATE_STORE_BUCKET }}
          MUTATION_GATE_STORE_PREFIX: ${{ vars.MUTATION_GATE_STORE_PREFIX }}
          MUTATION_GATE_STORE_REGION: ${{ vars.MUTATION_GATE_STORE_REGION }}
          MUTATION_GATE_STORE_ENDPOINT: ${{ vars.MUTATION_GATE_STORE_ENDPOINT }}
          MUTATION_GATE_STORE_ACCOUNT: ${{ vars.MUTATION_GATE_STORE_ACCOUNT }}
          MUTATION_GATE_STORE_CONTAINER: ${{ vars.MUTATION_GATE_STORE_CONTAINER }}
          MUTATION_GATE_STORE_PUBLIC_CONTAINER: ${{ vars.MUTATION_GATE_STORE_PUBLIC_CONTAINER }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          MUTATION_GATE_GCS_PROVIDER: ${{ vars.MUTATION_GATE_GCS_PROVIDER }}
          MUTATION_GATE_GCS_SERVICE_ACCOUNT: ${{ vars.MUTATION_GATE_GCS_SERVICE_ACCOUNT }}
        with:
          deliver: 'true'
          php-version: '%%php%%'
