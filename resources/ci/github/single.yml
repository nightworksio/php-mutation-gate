# Written by `mutation-gate init --ci=github`, for the gate %%version%%.
# Require the check `%%check%%` in the default branch's protection rule.
# For an S3 proof store, add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as
# secrets of the environment %%keys%%, whose deployment branches
# are %%branch%% alone: the job enters it on a push, a schedule or a manual
# run of %%branch%%, and a pull request's run reads the store through
# proofs.store.with.publicUrl. The tests run in the gate's step, so every
# secret the job holds reaches the project's code. A branch can edit this
# file, so the keys' protection is the environment's restriction to
# %%branch%%, not the condition below.
name: mutation

on:
  pull_request:
  push:
    branches: ['%%branch%%']
  schedule:
    - cron: '0 3 * * 1,4'

permissions:
  contents: read

jobs:
  mutation:
    name: '%%check%%'
    runs-on: ubuntu-latest
    environment:
      name: ${{ contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/%%branch%%' && '%%keys%%' || '' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nightworksio/php-mutation-gate@%%pin%%
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          php-version: '%%php%%'
          runner: '%%runner%%'
