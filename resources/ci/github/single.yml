# Written by `mutation-gate init --ci=github`, for the gate %%version%%.
# Require the check `mutation testing` in the default branch's protection rule.
# For an S3 proof store, set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY from
# secrets in the env of the gate's step.
name: mutation

on:
  pull_request:
  push:
    branches: ['%%branch%%']
  schedule:
    - cron: '0 3 * * 1,4'

permissions:
  contents: read

jobs:
  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nightworksio/php-mutation-gate@%%pin%%
        with:
          php-version: '%%php%%'
          runner: '%%runner%%'
