# Written by `mutation-gate init --ci=github`, for the gate %%version%%.
# Require the check `%%check%%` in the default branch's protection rule.
# For an S3 proof store, add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as
# secrets of the environment mutation-gate-store, whose deployment branches
# are the default branch alone, and the read-only key's pair as secrets of the
# environment mutation-gate-read. The job below passes each by name; its value
# reaches only the jobs that enter its environment, fetch and deliver, and
# never a shard.
name: mutation

on:
  pull_request:
  push:
    branches: ['%%branch%%']
  schedule:
    - cron: '0 3 * * 1,4'

permissions:
  contents: read

jobs:
  mutation:
    uses: nightworksio/php-mutation-gate/.github/workflows/mutation-gate.yml@%%pin%%
    permissions:
      contents: write # used only by the default-branch publish job
      actions: read
      pull-requests: write
      id-token: write # used only by fetch and deliver, for a store that signs in through OIDC
    with:
      php-version: '%%php%%'
      runner: '%%runner%%'
    secrets:
      MUTATION_GATE_READ_AWS_ACCESS_KEY_ID: ${{ secrets.MUTATION_GATE_READ_AWS_ACCESS_KEY_ID }}
      MUTATION_GATE_READ_AWS_SECRET_ACCESS_KEY: ${{ secrets.MUTATION_GATE_READ_AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
