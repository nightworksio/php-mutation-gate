# Written by `mutation-gate init --ci=bitbucket`, for the gate %%version%%.
# Set the image to one with PHP %%php%% and pcov: no official image is known to
# include pcov, and without it the first run cannot judge. Keep --shards equal
# to the parallel steps, and schedule the custom pipeline mutation-full on
# %%branch%% twice a week for the full run.
# Keep the ledger in S3 (proofs.store: s3): Bitbucket's caches are shared by
# every branch, so none of them keeps a branch from planting proofs. Hold
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as variables of the deployment
# environment %%deployment%%, and restrict its deployments to %%branch%%, which
# takes Bitbucket Premium. Without that restriction, any branch whose pipeline
# names the environment gets the keys.
# The verdicts of %%branch%%'s pipeline and of mutation-full deploy to
# %%deployment%% and write the ledger. A deployment cannot be a final step, so
# Bitbucket skips such a verdict after a failed shard: the pipeline is red,
# with no "cannot judge" report. Every other step runs with no keys and reads
# %%branch%%'s ledger through proofs.store.with.publicUrl, so set it, and give
# the bucket a public GetObject on that branch's prefix alone. Every other
# verdict is a final step, which runs whatever the shards did, and writes
# nothing. A pull request from a fork starts no pipeline.
image: <an image with PHP %%php%% and pcov>

clone:
  depth: full

definitions:
  steps:
    - step: &mutation-shard
        name: 'mutation: shard'
        script:
          - composer install --no-interaction --no-progress
          - vendor/bin/mutation-gate run --plan=.mutation-gate/plan.json
        artifacts:
          - .mutation-gate/results/**
    - step: &mutation-verdict
        name: 'mutation: verdict'
        script:
          - composer install --no-interaction --no-progress
          - vendor/bin/mutation-gate verdict --plan=.mutation-gate/plan.json --results=.mutation-gate/results

pipelines:
  branches:
    '%%branch%%':
      - step:
          name: 'mutation: plan'
          script:
            - composer install --no-interaction --no-progress
            - vendor/bin/mutation-gate plan --shards=4 --changed-since=last-passed
          artifacts:
            - .mutation-gate/**
      - parallel:
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
      - step:
          <<: *mutation-verdict
          deployment: '%%deployment%%'
  default:
    - step:
        name: 'mutation: plan'
        script:
          - default_branch='%%branch%%'
          - git fetch origin "+refs/heads/$default_branch:refs/remotes/origin/$default_branch"
          - composer install --no-interaction --no-progress
          - vendor/bin/mutation-gate plan --shards=4 "--changed-since=origin/$default_branch"
        artifacts:
          - .mutation-gate/**
    - parallel:
        - step: *mutation-shard
        - step: *mutation-shard
        - step: *mutation-shard
        - step: *mutation-shard
    - final: *mutation-verdict
  pull-requests:
    '**':
      - step:
          name: 'mutation: plan'
          script:
            - git fetch origin "+refs/heads/$BITBUCKET_PR_DESTINATION_BRANCH:refs/remotes/origin/$BITBUCKET_PR_DESTINATION_BRANCH"
            - composer install --no-interaction --no-progress
            - vendor/bin/mutation-gate plan --shards=4 "--changed-since=origin/$BITBUCKET_PR_DESTINATION_BRANCH"
          artifacts:
            - .mutation-gate/**
      - parallel:
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
      - final: *mutation-verdict
  custom:
    mutation-full:
      - step:
          name: 'mutation: plan'
          script:
            - composer install --no-interaction --no-progress
            - vendor/bin/mutation-gate plan --shards=4
          artifacts:
            - .mutation-gate/**
      - parallel:
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
      - step:
          <<: *mutation-verdict
          deployment: '%%deployment%%'
