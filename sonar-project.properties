# SonarCloud. The key and organisation are SonarCloud's defaults for this
# repository, and .github/scripts/sonar_gate.sh reads the key from here.
sonar.projectKey=nightworksio_php-mutation-gate
sonar.organization=nightworks
sonar.projectName=php-mutation-gate

sonar.sources=src,plugins/default/src
# Copy-paste detection skips each plugin's mutator classes: each class declares
# one mutator, as the SDK requires; the shared logic lives in the set's helpers,
# which stay measured. It also skips each adapter's Transcribing shell and each
# analyser's Started process: adapters share no code (rule A3), so each has its
# own, and what they share lives in Core\Runner\Transcript, Core\Runner\Withholding
# and Core\Analysis\AnalysisExit, which stay measured.
sonar.cpd.exclusions=plugins/*/src/*/**,src/Adapter/*/Transcribing.php,src/Adapter/*/Started.php
sonar.tests=tests,plugins/default/tests
# The runner contract suite's fixture is a user's library, and the static checker's
# holds mutants: neither is this package's tests.
sonar.test.exclusions=tests/Contract/Runner/fixture/**,tests/Contract/Runner/infection-fixture/**,tests/Contract/Runner/phpunit-fixture/**,tests/Contract/StaticChecker/fixture/**

# Coverage and test results come from `composer test:report`, which the
# `tests and coverage` job runs and hands to the scan.
sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.php.tests.reportPath=coverage/junit.xml

sonar.sourceEncoding=UTF-8
