# SonarCloud. The key and organisation are SonarCloud's defaults for this
# repository, and .github/scripts/sonar_gate.sh reads the key from here.
sonar.projectKey=nightworksio_php-mutation-gate
sonar.organization=nightworks
sonar.projectName=php-mutation-gate

sonar.sources=src,plugins/default/src,plugins/laravel/src,plugins/symfony/src,plugins/security/src,outbreak/crates/outbreak-map/src,outbreak/crates/outbreak/src
# Copy-paste detection skips each plugin's mutator classes: each class declares
# one mutator, as the SDK requires; the shared logic lives in the set's helpers,
# which stay measured. It also skips each runner's Transcribing shell: adapters
# share no code (rule A3), and each decorates its own Shell, whose Command and
# Ran are its own, so what they share lives in Core\Runner\Transcript, which
# stays measured. Each runner's PackageSource, which reads and writes the
# package a vendor patch changes, is skipped for the same reason: the patch's
# decisions live in Core\Composer\VendorPatch, which stays measured. And it
# skips OutsideTheVerdict, which lists every file of the gate no verdict
# depends on, glob by glob, under why: a list of paths that copy-paste
# detection reads as the same run of string literals as any other.
sonar.cpd.exclusions=plugins/*/src/*/**,src/Adapter/*/Transcribing.php,src/Adapter/*/PackageSource.php,src/Core/Proof/Key/OutsideTheVerdict.php
sonar.tests=tests,plugins/default/tests,plugins/laravel/tests,plugins/symfony/tests,plugins/security/tests,outbreak/crates/outbreak/tests

# S100 names methods in camelCase. The file:// wrapper's methods are PHP's
# streamWrapper protocol, whose names PHP fixes (stream_open, url_stat, ...),
# as H3's and D11's exemptions in phpstan.neon say for the same file.
sonar.issue.ignore.multicriteria=streamWrapper
sonar.issue.ignore.multicriteria.streamWrapper.ruleKey=php:S100
sonar.issue.ignore.multicriteria.streamWrapper.resourceKey=src/Adapter/Native/MutantFile.php
# The runner contract suite's fixture is a user's library, the static checker's
# holds mutants, and each CI template's snapshot is a user's pipeline: none of
# them is this package's tests.
sonar.test.exclusions=tests/Contract/Runner/fixture/**,tests/Contract/Runner/infection-fixture/**,tests/Contract/Runner/phpunit-fixture/**,tests/Contract/Runner/phpspec-fixture/**,tests/Contract/Runner/codeception-fixture/**,tests/Contract/Runner/testo-fixture/**,tests/Contract/StaticChecker/fixture/**,tests/Fixtures/CiTemplates/**,tests/Fixtures/Archive/**

# Coverage and test results come from `composer test:report`, which the
# `tests and coverage` job runs and hands to the scan.
sonar.php.coverage.reportPaths=coverage/clover.xml
# Outbreak's Rust (ADR-0118) is analysed for issues here, and held to every
# line covered by llvm-cov in its own `outbreak / coverage` job.
sonar.coverage.exclusions=outbreak/**
sonar.php.tests.reportPath=coverage/junit.xml

sonar.sourceEncoding=UTF-8
