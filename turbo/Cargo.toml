[workspace]
resolver = "3"
members = ["mutation-gate-turbo"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
