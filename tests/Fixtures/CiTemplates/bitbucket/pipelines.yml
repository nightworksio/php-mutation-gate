# Written by `mutation-gate init --ci=bitbucket`, for the gate dev-main.
# Set the image to one with PHP 8.5 and pcov: no official image is known to
# include pcov, and without it the first run cannot judge. Keep --shards equal
# to the parallel steps, and schedule the custom pipeline mutation-full on
# trunk twice a week for the full run.
# Keep the ledger in S3 (proofs.store: s3): Bitbucket's caches are shared by
# every branch, so none of them keeps a branch from planting proofs. Hold
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as variables of the deployment
# environment mutation-gate-store, and restrict its deployments to trunk, which
# takes Bitbucket Premium. Without that restriction, any branch whose pipeline
# names the environment gets the keys.
# The verdicts of trunk's pipeline and of mutation-full deploy to
# mutation-gate-store and write the ledger. A deployment cannot be a final step, so
# Bitbucket skips such a verdict after a failed shard: the pipeline is red,
# with no "cannot judge" report. While one pipeline deploys to mutation-gate-store,
# Bitbucket pauses any other at its verdict, to be resumed or rerun once the
# first ends. Every other step runs with no keys and reads trunk's ledger
# through proofs.store.with.publicUrl, so set it, and give the bucket a public
# GetObject on that branch's prefix alone. A pull request's verdict is a final
# step, which runs whatever the shards did, and writes nothing. A pull request
# from a fork starts no pipeline.
image: <an image with PHP 8.5 and pcov>

definitions:
  steps:
    - step: &mutation-shard
        name: 'mutation: shard'
        clone:
          depth: full
        script:
          - composer install --no-interaction --no-progress
          - vendor/bin/mutation-gate run --plan=.mutation-gate/plan.json
        artifacts:
          - .mutation-gate/results/**
    - step: &mutation-verdict
        name: 'mutation: verdict'
        clone:
          depth: full
        script:
          - composer install --no-interaction --no-progress
          - vendor/bin/mutation-gate verdict --plan=.mutation-gate/plan.json --results=.mutation-gate/results

pipelines:
  branches:
    'trunk':
      - step:
          name: 'mutation: plan'
          clone:
            depth: full
          script:
            - composer install --no-interaction --no-progress
            - vendor/bin/mutation-gate plan --shards=4 --changed-since=last-passed
          artifacts:
            - .mutation-gate/**
      - parallel:
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
      - step:
          <<: *mutation-verdict
          deployment: 'mutation-gate-store'
  pull-requests:
    '**':
      - step:
          name: 'mutation: plan'
          clone:
            depth: full
          script:
            - git fetch origin "+refs/heads/$BITBUCKET_PR_DESTINATION_BRANCH:refs/remotes/origin/$BITBUCKET_PR_DESTINATION_BRANCH"
            - composer install --no-interaction --no-progress
            - vendor/bin/mutation-gate plan --shards=4 "--changed-since=origin/$BITBUCKET_PR_DESTINATION_BRANCH"
          artifacts:
            - .mutation-gate/**
      - parallel:
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
      - final: *mutation-verdict
  custom:
    mutation-full:
      - step:
          name: 'mutation: plan'
          clone:
            depth: full
          script:
            - composer install --no-interaction --no-progress
            - vendor/bin/mutation-gate plan --shards=4
          artifacts:
            - .mutation-gate/**
      - parallel:
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
      - step:
          <<: *mutation-verdict
          deployment: 'mutation-gate-store'
