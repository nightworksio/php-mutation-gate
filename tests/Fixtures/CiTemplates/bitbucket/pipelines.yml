# Written by `mutation-gate init --ci=bitbucket`, for the gate dev-main.
# Set the image to one with PHP 8.5 and pcov: no official image is known to
# include pcov, and without it the first run cannot judge. Keep --shards equal
# to the parallel steps, and schedule the custom pipeline mutation-full on
# trunk twice a week for the full run.
# Keep the ledger in S3 (proofs.store: s3): Bitbucket's caches are shared by
# every branch, so none of them keeps a branch from planting proofs. Hold
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as variables of the deployment
# environment mutation-gate-store, and restrict its deployments to trunk, which
# takes Bitbucket Premium. Without that restriction, any branch whose pipeline
# names the environment gets the keys.
# The verdicts of trunk's pipeline and of mutation-full deploy to
# mutation-gate-store and write the ledger. A deployment cannot be a final step, so
# Bitbucket skips such a verdict after a failed shard: the pipeline is red,
# with no "cannot judge" report. While one pipeline deploys to mutation-gate-store,
# Bitbucket pauses any other at its verdict, to be resumed or rerun once the
# first ends. Every other step runs with no keys and reads trunk's ledger
# through proofs.store.with.publicUrl, so set it, and give the bucket a public
# GetObject on that branch's prefix alone. A pull request from a fork starts no
# pipeline.
# A pull request's verdict writes nothing, and leaves the comment for the
# final step, which runs whatever the shards did; after a failed shard,
# Bitbucket skips that verdict too, and the comment keeps its planned state.
# List bitbucket-comment, and bitbucket-insights for the Code Insights
# report, in the config's reports.
# Hold a repository access token with pullrequest:write alone in the secured
# repository variable MUTATION_GATE_BITBUCKET_TOKEN. Repository variables reach every
# step, so every step that runs the project's code drops it first, and the two
# comment steps run the gate's own image, which loads none of the project's
# code. A branch can edit this file, so anyone who may push one can read the
# token, as with every repository variable.
image: <an image with PHP 8.5 and pcov>

definitions:
  steps:
    - step: &mutation-shard
        name: 'mutation: shard'
        clone:
          depth: full
        script:
          - unset MUTATION_GATE_BITBUCKET_TOKEN
          - composer install --no-interaction --no-progress
          - vendor/bin/mutation-gate run --plan=.mutation-gate/plan.json
        artifacts:
          - .mutation-gate/results/**
    - step: &mutation-verdict
        name: 'mutation: verdict'
        clone:
          depth: full
        script:
          - unset MUTATION_GATE_BITBUCKET_TOKEN
          - composer install --no-interaction --no-progress
          - vendor/bin/mutation-gate verdict --plan=.mutation-gate/plan.json --results=.mutation-gate/results
    - step: &mutation-comment
        name: 'mutation: comment'
        image: ghcr.io/nightworksio/mutation-gate:<its version>
        clone:
          enabled: false
        script:
          - mutation-gate deliver --from=.mutation-gate/delivery/planned

pipelines:
  branches:
    'trunk':
      - step:
          name: 'mutation: plan'
          clone:
            depth: full
          script:
            - unset MUTATION_GATE_BITBUCKET_TOKEN
            - composer install --no-interaction --no-progress
            - vendor/bin/mutation-gate plan --shards=4 --changed-since=last-passed
          artifacts:
            - .mutation-gate/**
      - parallel:
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
      - step:
          <<: *mutation-verdict
          deployment: 'mutation-gate-store'
  pull-requests:
    '**':
      - step:
          name: 'mutation: plan'
          clone:
            depth: full
          script:
            - unset MUTATION_GATE_BITBUCKET_TOKEN
            - git fetch origin "+refs/heads/$BITBUCKET_PR_DESTINATION_BRANCH:refs/remotes/origin/$BITBUCKET_PR_DESTINATION_BRANCH"
            - composer install --no-interaction --no-progress
            - vendor/bin/mutation-gate plan --shards=4 "--changed-since=origin/$BITBUCKET_PR_DESTINATION_BRANCH" --deliver-later
          artifacts:
            - .mutation-gate/**
      - step: *mutation-comment
      - parallel:
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
      - step:
          <<: *mutation-verdict
          script:
            - unset MUTATION_GATE_BITBUCKET_TOKEN
            - composer install --no-interaction --no-progress
            - vendor/bin/mutation-gate verdict --plan=.mutation-gate/plan.json --results=.mutation-gate/results --deliver-later
          artifacts:
            - .mutation-gate/delivery/**
      - final:
          <<: *mutation-comment
          script:
            - mutation-gate deliver --from=.mutation-gate/delivery/verdict
  custom:
    mutation-full:
      - step:
          name: 'mutation: plan'
          clone:
            depth: full
          script:
            - unset MUTATION_GATE_BITBUCKET_TOKEN
            - composer install --no-interaction --no-progress
            - vendor/bin/mutation-gate plan --shards=4
          artifacts:
            - .mutation-gate/**
      - parallel:
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
          - step: *mutation-shard
      - step:
          <<: *mutation-verdict
          deployment: 'mutation-gate-store'
