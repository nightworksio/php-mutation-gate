# Written by `mutation-gate init --ci=gitlab`, for the gate dev-main. The
# jobs `mutation-gate plan --ci=gitlab` generates extend this hidden job, and
# so does the plan job in .gitlab-ci.yml.
# For an S3 proof store, set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as
# protected, masked CI/CD variables, which only protected branches' pipelines
# see, never a merge request's: keep trunk the only protected branch, or
# trust everyone who may push to one. The generated verdict job mutation-gate-
# verdict-store keeps them, and runs only on a push, a schedule or a manual
# run of trunk; every other job drops them before composer install, and
# reads the store through proofs.store.with.publicUrl. A branch can edit this
# file, so the keys' protection is the variables' protection, not the line
# below.
# For the merge request note, list gitlab-comment in the config's reports, and
# set MUTATION_GATE_GITLAB_TOKEN to a project access token with the scope api and
# the role Reporter, as a masked CI/CD variable that is not protected: a merge
# request's pipeline runs on its own branch. Every job that extends
# .mutation-gate drops it before composer install, and the comment jobs extend
# .mutation-gate-comment, which runs the gate's own image and none of the
# project's code. A branch can edit this file, so anyone who may push one can
# read the token.
.mutation-gate:
  # image: <an image with PHP 8.5 and pcov>
  # No official image is known to include pcov, and without it the first run
  # cannot judge. Set the image, or install pcov in before_script.
  cache:
    key: mutation-gate-ledger-$CI_COMMIT_REF_SLUG
    paths:
      - .mutation-gate/ledger/
  before_script:
    - '[ "$CI_JOB_NAME" = "mutation-gate-verdict-store" ] || unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_ROLE_ARN'
    - unset MUTATION_GATE_GITLAB_TOKEN
    - composer install --no-interaction --no-progress

.mutation-gate-comment:
  image:
    name: ghcr.io/nightworksio/mutation-gate:<its version>
    entrypoint: ['']
  script:
    - mutation-gate deliver "--from=$MUTATION_GATE_DELIVERY"
