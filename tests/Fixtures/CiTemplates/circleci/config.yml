# Set each image to one with PHP 8.5 and pcov: no official image is known
# to include pcov, and without it the first run cannot judge.
# Any branch can save a cache under any key here, so a branch can plant proofs
# the default branch then trusts. Keep the ledger in S3 with credentials only
# trunk's runs hold, and drop the cache steps.
# For an S3 proof store, set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in
# the context mutation-gate-store, and restrict it with the expression
# pipeline.git.branch == "trunk". Only mutation-verdict uses it, in the
# workflow mutation-store, which runs on a push, a schedule or an API trigger
# of trunk. The plan runs the whole suite, so it never holds the keys,
# and reads the store through proofs.store.with.publicUrl, as every other
# run's verdict does. A branch can edit this file, so the keys' protection is
# the context's restriction to trunk, not the condition below.
version: 2.1

parameters:
  shards:
    type: integer
    default: 4

jobs:
  mutation-plan:
    docker:
      - image: <an image with PHP 8.5 and pcov>
    environment:
      MUTATION_GATE_DEFAULT_BRANCH: 'trunk'
    steps:
      - checkout
      - run: |
          mkdir -p .mutation-gate
          echo "$CIRCLE_BRANCH" > .mutation-gate/branch
          echo "$MUTATION_GATE_DEFAULT_BRANCH" > .mutation-gate/default-branch
      - restore_cache:
          keys:
            - mutation-gate-ledger-{{ checksum ".mutation-gate/branch" }}-
      - restore_cache:
          keys:
            - mutation-gate-ledger-{{ checksum ".mutation-gate/default-branch" }}-
      - run: composer install --no-interaction --no-progress
      - run: |
          if [ "<< pipeline.trigger_source >>" = "scheduled_pipeline" ]; then base=""
          elif [ -n "$CIRCLE_PULL_REQUEST" ]; then base="--changed-since=origin/$MUTATION_GATE_DEFAULT_BRANCH"
          elif [ "$CIRCLE_BRANCH" = "$MUTATION_GATE_DEFAULT_BRANCH" ]; then base="--changed-since=last-passed"
          else base="--changed-since=origin/$MUTATION_GATE_DEFAULT_BRANCH"; fi
          vendor/bin/mutation-gate plan --shards=<< pipeline.parameters.shards >> $base
      - persist_to_workspace:
          root: .
          paths:
            - .mutation-gate
  mutation:
    parallelism: << pipeline.parameters.shards >>
    docker:
      - image: <an image with PHP 8.5 and pcov>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/mutation-gate run --plan=.mutation-gate/plan.json
      - persist_to_workspace:
          root: .
          paths:
            - .mutation-gate/results
  mutation-verdict:
    docker:
      - image: <an image with PHP 8.5>
    environment:
      MUTATION_GATE_DEFAULT_BRANCH: 'trunk'
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/mutation-gate verdict --plan=.mutation-gate/plan.json --results=.mutation-gate/results
      - run: |
          [ "$CIRCLE_BRANCH" = "$MUTATION_GATE_DEFAULT_BRANCH" ] \
            || rm -rf ".mutation-gate/ledger/refs/heads/$MUTATION_GATE_DEFAULT_BRANCH"
      - save_cache:
          key: mutation-gate-ledger-{{ checksum ".mutation-gate/branch" }}-{{ .Revision }}
          paths:
            - .mutation-gate/ledger

workflows:
  mutation-store:
    when: &trusted
      and:
        - or:
            - equal: [webhook, << pipeline.trigger_source >>]
            - equal: [scheduled_pipeline, << pipeline.trigger_source >>]
            - equal: [api, << pipeline.trigger_source >>]
        - equal: ['trunk', << pipeline.git.branch >>]
    jobs:
      - mutation-plan
      - mutation:
          requires:
            - mutation-plan
      - mutation-verdict:
          context:
            - mutation-gate-store
          requires:
            - mutation: terminal
  mutation:
    unless: *trusted
    jobs:
      - mutation-plan
      - mutation:
          requires:
            - mutation-plan
      - mutation-verdict:
          requires:
            - mutation: terminal
