# Written by `mutation-gate init --ci=github`, for the gate dev-main.
# Require the check `mutation / verdict` in the default branch's protection rule.
# For an S3 proof store, add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as
# secrets of the environment mutation-gate-store, whose deployment branches
# are the default branch alone, and the read-only key's pair as secrets of the
# environment mutation-gate-read. The job below passes each by name; its value
# reaches only the jobs that enter its environment, fetch and deliver, and
# never a shard.
name: mutation

on:
  pull_request:
  merge_group:
  push:
    branches: ['trunk']
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

# A pull request pushed again cancels its run on the older head. A push to the
# default branch waits for the run before it, since only a verdict writes the
# ledger. Every other run is a group of its own.
concurrency:
  group: mutation-${{ contains(fromJSON('["pull_request","push"]'), github.event_name) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    uses: nightworksio/php-mutation-gate/.github/workflows/mutation-gate.yml@eea11e875234b32127cf23dde00d149b04c6ac4c
    permissions:
      contents: write # used only by publish, on the default branch, which writes the badge and the trend
      actions: read # used only by verdict and deliver, to find the run's HTML report the comment links
      pull-requests: write # used only by the deliver jobs, which post the comment and run none of the project's code
      id-token: write # used only by fetch and deliver, for a store that signs in through OIDC
    with:
      php-version: '8.5'
      runner: 'pest'
    secrets:
      MUTATION_GATE_READ_AWS_ACCESS_KEY_ID: ${{ secrets.MUTATION_GATE_READ_AWS_ACCESS_KEY_ID }}
      MUTATION_GATE_READ_AWS_SECRET_ACCESS_KEY: ${{ secrets.MUTATION_GATE_READ_AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
