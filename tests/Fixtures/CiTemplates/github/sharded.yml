# Written by `mutation-gate init --ci=github`, for the gate dev-main.
# Require the check `mutation / verdict` in the default branch's protection rule.
# For an S3 proof store, pass AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as
# secrets to the job below.
name: mutation

on:
  pull_request:
  push:
    branches: ['trunk']
  schedule:
    - cron: '0 3 * * 1,4'

permissions:
  contents: read

jobs:
  mutation:
    uses: nightworksio/php-mutation-gate/.github/workflows/mutation-gate.yml@eea11e875234b32127cf23dde00d149b04c6ac4c
    permissions:
      contents: write # used only by the default-branch publish job
      actions: read
      pull-requests: write
    with:
      php-version: '8.5'
      runner: 'pest'
