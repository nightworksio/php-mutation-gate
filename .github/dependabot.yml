# Grouped, so a week's updates to tools that move together arrive as one pull
# request rather than one each, and each runs the full gate set once.

version: 2

# In every ecosystem a release waits seven days before it is offered, so a
# revision pulled shortly after publication is one somebody else has already
# run. Security updates are never held by a cooldown.

updates:
  # The package and the contract suites' fixture libraries, in one entry, so a
  # group's update moves the package's lock and every fixture's in one pull
  # request: the fixtures' php-code-coverage moves with the package's, whose
  # maps the adapters read. The fixtures' locks hold the highest releases the
  # required `runner contracts` job runs; the runner canary runs the newest.
  - package-ecosystem: composer
    directories:
      - /
      - /tests/Contract/Runner/fixture
      - /tests/Contract/Runner/infection-fixture
      - /tests/Contract/Runner/infection-fixture/phpunit-12
      - /tests/Contract/Runner/phpunit-fixture
      - /tests/Contract/StaticChecker/fixture
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # The analysis toolchain moves together and breaks together: a new PHPStan
      # minor and a new rule package are one change to review.
      analysis:
        patterns:
          - 'phpstan/*'
          - '*/phpstan-*'
          - 'ergebnis/*'
          - 'rector/*'
          - 'laravel/pint'
          - 'nikic/php-parser'
          - 'shipmonk/*'
          - 'spaze/*'
          - 'tomasvotruba/*'
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - 'pestphp/*'
          - 'phpunit/*'
          - 'symfony/*'
        update-types:
          - minor
          - patch
      # The runners and the analyser only a fixture library installs.
      runners:
        patterns:
          - 'infection/*'
          - 'carthage-software/*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope

  # The markdownlint the `hygiene / markdown` job runs, locked with the
  # formatter that writes its evidence (ADR-0019).
  - package-ecosystem: npm
    directory: /.github/bot/markdownlint
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      markdownlint:
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    groups:
      # `init`, `analyze` and `upload-sarif` are one action, and CodeQL refuses
      # a run whose parts are different revisions of it.
      codeql:
        patterns: ['github/codeql-action*']
        update-types: ['major', 'minor', 'patch']
      actions:
        patterns: ['*']
        # Majors left out, so each arrives on its own.
        update-types: ['minor', 'patch']
    commit-message:
      prefix: build
      include: scope
