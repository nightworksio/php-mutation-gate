name: Run the network group
description: >-
  The suite's network group, with the schemas it validates against kept by
  their pinned digests, so a publisher's outage fails no run whose cache holds
  them. A changed pin starts from the newest set, and the whole set is saved
  only where every schema was there to validate against: a set a host's failure
  left short would be the newest, and each run after it would fetch what it
  lacks again.
inputs:
  junit:
    description: Where the group's JUnit log is written.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/mutation-gate-schema-*.json
        key: schemas-${{ hashFiles('tests/Unit/Core/Ci/CiTemplateTest.php', 'tests/Unit/Core/Report/SarifTest.php') }}-${{ github.run_id }}-${{ github.job }}
        restore-keys: |
          schemas-${{ hashFiles('tests/Unit/Core/Ci/CiTemplateTest.php', 'tests/Unit/Core/Report/SarifTest.php') }}-
          schemas-
    - shell: bash
      env:
        JUNIT: ${{ inputs.junit }}
      run: |
        mkdir -p "$(dirname "${JUNIT}")"
        composer test:network -- --log-junit="${JUNIT}"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/mutation-gate-schema-*.json
        key: schemas-${{ hashFiles('tests/Unit/Core/Ci/CiTemplateTest.php', 'tests/Unit/Core/Report/SarifTest.php') }}-${{ github.run_id }}-${{ github.job }}
