name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Every gate, every night, whatever merged: a pull request runs only the
  # runner legs and the warm workers its paths reach.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head. A push to main
# never cancels the run before it (ADR-0059): only a verdict writes the
# ledger, so the newer push waits, and a newer one still takes its place. A
# scheduled run is grouped by its own run: never cancelled, it never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ contains(fromJSON('["pull_request","push"]'), github.event_name) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.5'
  # The lowest PHP composer.json admits, which the lowest dependencies run on.
  LOWEST_PHP: '8.4'

# The fast PHP gates share one job and one install. The slow ones (the planted
# rules, coverage and the lowest dependencies) each have their own.

jobs:
  # Which of the gated jobs are worth running at all, which runner legs, and
  # which end-to-end jobs (scope.py). A documentation change starts none of
  # the PHP gates, and asking costs one checkout.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # used only by a push, to read which gates its pull request passed
    outputs:
      jobs: ${{ steps.proven.outputs.jobs || steps.diff.outputs.jobs }}
      runners: ${{ steps.diff.outputs.runners }}
      warm: ${{ steps.diff.outputs.warm }}
      hooks: ${{ steps.diff.outputs.hooks }}
      builds: ${{ steps.diff.outputs.builds }}
      judged: ${{ steps.nightly.outputs.judged }}
      streams: ${{ steps.diff.outputs.streams }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          # A pull request is measured against its base, and a push to main
          # against the commit before it.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            python3 .github/scripts/scope.py "${EVENT}" --no-base | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only "${BASE}" HEAD | python3 .github/scripts/scope.py "${EVENT}" | tee -a "$GITHUB_OUTPUT"
          fi
      # A push drops the gates its pull request passed on this very tree
      # (ADR-0122). The repository variable PROVEN_PUSH set to false runs them.
      - id: proven
        if: github.event_name == 'push' && vars.PROVEN_PUSH != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: ${{ steps.diff.outputs.jobs }}
        run: python3 .github/scripts/proven_push.py | tee -a "$GITHUB_OUTPUT"
      # The nightly unproven run judges nothing new where main's head is the
      # head the last passing nightly run judged, so it is skipped.
      - id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          last="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          if [ "${last}" = "${HEAD}" ]; then
            echo "judged=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The last passing nightly run judged ${HEAD} in full, so this one judges nothing new and is skipped."
          fi
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py scope

  # The deciding half of every script under .github/scripts and of the
  # action's script, tested without a runner (ADR-0019).
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: unittest
        run: python3 .github/scripts/unit.py evidence/raw/scripts.json
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-scripts
          path: evidence/scripts*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py scripts

  # Workflow lint and audit, spelling, links and Markdown, over every change.
  # Every call to a workflow of this repository keeps the `./` form, which
  # zizmor's self-repository audit would change to `$/`: actionlint 1.7.12
  # refuses `$/`.
  hygiene:
    uses: ./.github/workflows/hygiene.yml # zizmor: ignore[self-repository]

  # The docs site, built and its links checked, where `scope` lists it: where
  # the docs, the site or what prints a link changed (ADR-0038).
  site:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'site')) }}
    uses: ./.github/workflows/site.yml # zizmor: ignore[self-repository]

  # Every test file a mutant's narrowed run can load passes alone on the
  # unmutated code, so that its run can vouch for its kills, and a file that
  # leans on another is named the day it starts to.
  alone:
    name: test files alone
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'alone')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: pcntl, sodium
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - id: alone
        run: python3 .github/scripts/alone.py . --findings evidence/raw/alone.json
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py alone
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-alone
          path: evidence/alone*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py alone

  # R1 — the rules, before anything slower gets a chance to hide a broken
  # boundary. The Arch suite reads ARCHITECTURE.md against the code, so it runs
  # on every change, documentation included.
  rules:
    name: rules
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - id: arch
        run: |
          mkdir -p evidence/raw
          vendor/bin/pest --testsuite=Arch --log-junit=evidence/raw/rules.xml
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py rules
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-rules
          path: evidence/rules*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py rules

  # Every rule refuses a violation of itself, planted in a copy of the checkout
  # under the runner's temporary directory, never in the checkout itself.
  #
  # Each gated job below runs where `scope` lists it, and also where `scope`
  # itself did not succeed: a checkout that broke leaves no output, and no
  # output is not a "no". A job skipped by its `if:` reports success, so a
  # required check it holds passes.
  guards:
    name: the rules refuse violations
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'guards')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pcov for G7's guard, which runs the covered suite in a copy of its own.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - id: guards
        run: |
          mkdir -p evidence/raw
          composer test:guards -- --log-junit=evidence/raw/guards.xml
      # The guards phpunit.xml leaves out by default: S2's, which asks
      # Packagist for advisories, and G7's, which runs the covered suite.
      # Neither skips: without the network or a driver, it fails.
      - id: guards-ci
        if: ${{ !cancelled() }}
        run: composer test:guards:ci -- --log-junit=evidence/raw/guards-ci.xml
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py guards
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-guards
          path: evidence/guards*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py guards

  # The package's metadata, formatting, static analysis, dead idioms and
  # dependency hygiene. One install, one PHP, no coverage driver.
  checks:
    name: checks
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'checks')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # PHPStan's cache tracks what each file depends on, and Pint's keeps each
      # passing file's hash under its config and release, since each fixer
      # reads one file. Rector runs uncached: a file it cached stays clean when
      # a class declared elsewhere changes what a rule does to it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .phpstan-cache
          key: analysis-${{ runner.os }}-${{ github.sha }}
          restore-keys: analysis-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pint-cache
          key: lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: lint-${{ runner.os }}-
      # Cheapest first, so a misplaced brace fails in seconds rather than after
      # the analyser has walked the tree. Each tool reports in its structured
      # form, into evidence/raw, and the evidence step shows every finding as an
      # annotation (ADR-0019).
      # Each plugin's composer.json is checked on its own too, as it will be
      # once the plugin leaves (A8), and so is the manifest the keyed jobs
      # install the gate's own copy from, with its lock.
      - id: validate
        run: |
          mkdir -p evidence/raw
          composer validate --strict
          for manifest in plugins/*/composer.json; do composer validate --strict --no-check-lock "$manifest"; done
          COMPOSER=resources/action/keyed/composer.json composer validate --strict
      - id: normalize
        run: |
          set -o pipefail
          composer normalize --dry-run 2>&1 | tee evidence/raw/normalize.txt
          for manifest in plugins/*/composer.json resources/action/keyed/composer.json; do composer normalize --dry-run "$manifest" 2>&1 | tee -a evidence/raw/normalize.txt; done
      # The gate's own copy, as the action's deliver job installs it from the
      # archive GitHub serves the action as, which leaves out every
      # export-ignore path: it installs from its lock alone, and starts.
      - id: own-copy
        run: |
          set -euo pipefail
          copy="${RUNNER_TEMP}/action"
          mkdir -p "${copy}"
          git archive --format=tar HEAD | tar -x -C "${copy}"
          bash "${copy}/resources/action/install.sh" "${copy}"
          said="$(php "${copy}/bin/mutation-gate" deliver --from="${RUNNER_TEMP}/no-delivery" 2>&1 || true)"
          if [[ "${said}" != *"so deliver sends nothing."* ]]; then
            echo "::error::The gate's own copy did not start deliver: ${said}"
            exit 1
          fi
      - id: audit
        run: composer audit --locked --format=json > evidence/raw/audit.json
      - id: lint
        run: composer lint -- --format=json > evidence/raw/pint.json
      - id: analyse
        run: composer analyse -- --error-format=json --no-progress > evidence/raw/phpstan.json
      - id: refactor
        run: composer refactor -- --output-format=json > evidence/raw/rector.json
      - id: deps
        run: composer deps -- --format=junit > evidence/raw/deps.xml
      # The fixes that are mechanical, computed here and offered to the pull
      # request as a patch, never pushed (ADR-0019).
      - name: compute the mechanical fixes
        if: failure() && (steps.normalize.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.refactor.outcome == 'failure')
        run: |
          composer refactor:fix
          composer lint:fix
          composer normalize
          git diff > evidence/checks.fix.patch
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py checks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-checks
          path: evidence/checks*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py checks

  # The suite under pcov, by scripts/coverage.sh: the mutation plan's map is
  # read from its PHP report, and `coverage` holds its coverage to G7. It runs
  # on pushes to main as well, for `sonar`. Where a full early run's streams
  # ran the judging suites (ADR-0135 decision 8), it runs only the rest.
  tests:
    name: tests and coverage
    needs: [scope, mutation-early]
    if: ${{ !cancelled() && (needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'tests')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          # The zstd extension, so the ledger's zstd is covered both through it and through the program (ADR-0085).
          extensions: zstd
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.mutation-early.outputs.suite == 'true' }}
        with:
          name: mutation-gate-suite
          path: .mutation-gate/streamed
      # Pest's --coverage writes its PHP report to its own path and deletes it
      # once it has printed the summary, so that path is linked to the one
      # the gate's map is read from, which keeps the report.
      - id: suite
        env:
          STREAMED: ${{ needs.mutation-early.outputs.suite == 'true' && '.mutation-gate/streamed' || '' }}
          COVERAGE_ELSEWHERE: coverage/tests.php
        run: |
          set -euo pipefail
          report=$(php -r 'require "vendor/autoload.php"; echo \Pest\Support\Coverage::getPath();')
          mkdir -p .mutation-gate/ran "$(dirname "${report}")"
          : > .mutation-gate/ran/coverage.php
          ln -f .mutation-gate/ran/coverage.php "${report}"
          composer test:report
      # The gate's own map, read from the PHP report in the job that wrote it,
      # since reading a runner's report can run code (ADR-0006).
      - id: map
        run: php bin/mutation-gate coverage --from=.mutation-gate/ran --into=.mutation-gate/map
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-gate-map
          path: .mutation-gate/map/map.json.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - id: network
        if: ${{ !cancelled() }}
        uses: ./.github/actions/network-suite # zizmor: ignore[self-repository]
        with:
          junit: evidence/raw/tests-network.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-of-tests
          path: |
            coverage/tests.php
            coverage/junit.xml
          if-no-files-found: error
          retention-days: 1
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-tests
          path: evidence/tests*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py tests

  # G7 — every line of src is run: the suite's coverage with the lines of the
  # processes its tests start, Pest's highest runner contract leg's, and
  # Outbreak's boundary's, merged, with nothing exempt.
  coverage:
    needs: [tests, outbreak]
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - id: runner
        env:
          COVERAGE_INTO: ${{ github.workspace }}/.coverage/runner
        run: .github/scripts/leg.sh pest highest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-of-*
          path: .coverage
      - id: merge
        run: |
          mkdir -p coverage
          cp .coverage/coverage-of-tests/junit.xml coverage/junit.xml
          php scripts/process-coverage.php merge .coverage/merged.php coverage/clover.xml \
            .coverage/coverage-of-tests/tests.php .coverage/runner/collected.php .coverage/coverage-of-boundary/collected.php
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage/clover.xml
            coverage/junit.xml
          if-no-files-found: error
          retention-days: 1
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-coverage
          path: evidence/coverage*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py coverage

  # The suite against the oldest release of every dependency the constraints in
  # composer.json admit, so a lower bound that no longer works is found here
  # rather than by whoever installs it.
  lowest:
    name: lowest dependencies
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'lowest')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.LOWEST_PHP }}
          coverage: none
      # `lowest` is `composer update --prefer-lowest --prefer-stable`.
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: lowest
      - id: suite
        run: |
          mkdir -p evidence/raw
          composer test -- --log-junit=evidence/raw/lowest.xml
      - id: network
        if: ${{ !cancelled() }}
        uses: ./.github/actions/network-suite # zizmor: ignore[self-repository]
        with:
          junit: evidence/raw/lowest-network.xml
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py lowest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-lowest
          path: evidence/lowest*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py lowest

  # The gate's PHAR (ADR-0022), built as a release builds it, and smoke-run.
  phar:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'phar')) }}
    uses: ./.github/workflows/phar.yml # zizmor: ignore[self-repository]

  # The gate's image, built and run for each platform a release pushes, on a
  # pull request that changes how it or the PHAR is built, and nightly.
  image:
    needs: scope
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule') && (needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'image')) }}
    uses: ./.github/workflows/image.yml # zizmor: ignore[self-repository]

  # ADR-0004's Runner and ADR-0020's StaticChecker contract suites against the
  # real runners and analysers: one job per runner, its two legs each with its
  # own install, suite and outcome. Each fixture is installed at the highest
  # releases its lock holds, which Dependabot moves, and at the lowest its
  # manifest allows, so a leg reds only for a change here; the runner canary
  # runs the newest (ADR-0017). The suite runs serially: a Pest under paratest
  # takes itself for a worker. `runner contracts` reads every leg's log.
  runner-contract:
    name: runner contract
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.runners != '[]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The runners whose legs this run reaches, every one where `what
        # changed` could not say.
        runner: ${{ fromJSON(needs.scope.outputs.runners || '["pest", "infection-13", "infection-12", "phpunit", "phpspec", "codeception", "testo", "analysers"]') }}
    env:
      RESOLUTIONS: highest lowest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # Each leg is legs.json's (leg_support.py). Its downloads are cached by
      # the fixtures' manifests and locks, and the root lock, whose
      # php-code-coverage the lowest Pest and PHPUnit resolutions pin.
      - name: find Composer's download cache
        id: composer-files
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-files.outputs.dir }}
          key: runner-fixture-${{ runner.os }}-${{ matrix.runner }}-${{ hashFiles('tests/Contract/**/composer.json', 'tests/Contract/**/composer.lock', 'composer.lock') }}
          restore-keys: runner-fixture-${{ runner.os }}-${{ matrix.runner }}-
      # Each leg in turn, whether or not the one before it passed.
      - id: contract
        env:
          RUNNER: ${{ matrix.runner }}
        run: |
          failed=0
          for resolution in ${RESOLUTIONS}; do
            echo "${RUNNER} at its ${resolution} releases"
            .github/scripts/leg.sh "${RUNNER}" "${resolution}" || failed=1
          done
          exit "${failed}"
      # The test support the legs' tests use is the support legs.json lists,
      # which `what changed` runs them for.
      - name: the legs' test support is listed
        if: ${{ !cancelled() }}
        env:
          RUNNER: ${{ matrix.runner }}
        run: python3 .github/scripts/leg_support.py check "${RUNNER}"
      # Each leg's log and its suite's outcome, by the leg's name, which
      # `runner contracts` reads as its evidence.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: runner-contract-${{ matrix.runner }}
          path: evidence/raw/${{ matrix.runner }}-*
          if-no-files-found: error
          retention-days: 1
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py runner-contract

  # The check main requires of the runner contracts: it passes only where
  # every leg of `runner contract` passed, and its evidence is what each leg's
  # suite reported. A leg that left no log, for an install that failed, is
  # read as one whose suite never ran.
  runner-contracts:
    name: runner contracts
    needs: [scope, runner-contract]
    if: ${{ !cancelled() && (needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'runner-contracts')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runner-contract-*
          path: evidence/raw
          merge-multiple: true
      # Each leg's outcome by its name, as the evidence step reads the
      # outcome of a job's steps by their ids.
      - id: legs
        name: what each leg's suite did
        run: |
          shopt -s nullglob
          outcomes=(evidence/raw/*.outcome.json)
          if [ "${#outcomes[@]}" -eq 0 ]; then
            echo 'steps={}' >> "$GITHUB_OUTPUT"
          else
            echo "steps=$(jq -cs add "${outcomes[@]}")" >> "$GITHUB_OUTPUT"
          fi
      - name: every leg passed
        env:
          LEGS: ${{ needs.runner-contract.result }}
          RUNNERS: ${{ needs.scope.outputs.runners }}
        run: |
          if [ "${LEGS}" = skipped ] && [ "${RUNNERS}" = '[]' ]; then
            echo "This run reaches no runner's adapter or fixture, so no leg ran."
          elif [ "${LEGS}" != success ]; then
            echo "::error title=runner contracts::A leg of runner contract ended ${LEGS}. Its own log says why."
            exit 1
          fi
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ steps.legs.outputs.steps }}
        run: python3 .github/scripts/evidence.py runner-contracts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-runner-contracts
          path: evidence/runner-contracts*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py runner-contracts

  # The gate installed into another project: warm workers and the hook
  # managers.
  end-to-end:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'end-to-end')) }}
    uses: ./.github/workflows/end-to-end.yml # zizmor: ignore[self-repository]
    with:
      warm: ${{ needs.scope.result != 'success' || needs.scope.outputs.warm == 'true' }}
      hooks: ${{ needs.scope.result != 'success' || needs.scope.outputs.hooks == 'true' }}

  # Outbreak's core (ADR-0118), called on every run so its `passed` reports.
  outbreak:
    needs: scope
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/outbreak.yml # zizmor: ignore[self-repository]
    with:
      gates: ${{ needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'outbreak') }}
      builds: ${{ needs.scope.result != 'success' || needs.scope.outputs.builds == 'true' }}
      boundary: ${{ needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'tests') }}

  # G8 — every mutant of src is killed, or its tree holds the floor
  # mutation-gate.baseline.json records, which only rises (G11), judged by the
  # reusable workflow and action of this commit with mutation-gate.json, whose
  # reports are its evidence (.github/gates.json). A called job gets only the
  # permissions it asks for: `contents: write` only the default-branch publish
  # job, `id-token: write` only fetch and deliver, whose environments hold the
  # store's keys (ADR-0029). The plan reads the map `tests` wrote, or measures
  # its own where `tests` was skipped, and a run whose suite or fast gates fail
  # spends no mutation. It runs on every pull request, since a called
  # workflow's required check reports only when its caller runs, on Arm
  # (ADR-0035). ADR-0135: where the config lets a full split-stream run start
  # early (`streams`), this caller runs beside the fast gates and its shards
  # stop once one failed; where it cannot, `mutation` runs with the fresh map.
  mutation-early:
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.streams == 'true' && needs.scope.outputs.judged != 'true' }}
    permissions:
      contents: write # used only by publish, on the default branch, which writes the badge and the trend
      actions: read # used only by verdict and deliver, to find the run's HTML report the comment links
      pull-requests: write # used only by the deliver jobs, which post the comment and run none of the project's code
      id-token: write # used only by fetch and deliver, for a store that signs in through OIDC
    uses: ./.github/workflows/mutation-gate.yml # zizmor: ignore[self-repository]
    with:
      early-only: true
      watch-jobs: |
        checks
        rules
        scripts
      # The zstd extension, so the ledger's zstd is mutated through it as the tests cover it (ADR-0085).
      extensions: zstd
      runs-on: ubuntu-24.04-arm
      mode: ${{ github.event_name == 'schedule' && 'unproven' || 'auto' }}
      merged-records: true
    secrets:
      MUTATION_GATE_READ_AWS_ACCESS_KEY_ID: ${{ secrets.MUTATION_GATE_READ_AWS_ACCESS_KEY_ID }}
      MUTATION_GATE_READ_AWS_SECRET_ACCESS_KEY: ${{ secrets.MUTATION_GATE_READ_AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  mutation:
    needs: [scope, tests, checks, rules, scripts, mutation-early]
    if: ${{ !cancelled() && (needs.mutation-early.result == 'skipped' || needs.mutation-early.outputs.waits == 'true') && needs.tests.result != 'failure' && needs.checks.result != 'failure' && needs.rules.result != 'failure' && needs.scripts.result != 'failure' && needs.scope.outputs.judged != 'true' }}
    permissions:
      contents: write # used only by publish, on the default branch, which writes the badge and the trend
      actions: read # used only by verdict and deliver, to find the run's HTML report the comment links
      pull-requests: write # used only by the deliver jobs, which post the comment and run none of the project's code
      id-token: write # used only by fetch and deliver, for a store that signs in through OIDC
    uses: ./.github/workflows/mutation-gate.yml # zizmor: ignore[self-repository]
    with:
      coverage: ${{ needs.tests.result == 'success' && 'mutation-gate-map' || '' }}
      # The zstd extension, so the ledger's zstd is mutated through it as the tests cover it (ADR-0085).
      extensions: zstd
      runs-on: ubuntu-24.04-arm
      mode: ${{ github.event_name == 'schedule' && 'unproven' || 'auto' }}
      merged-records: true
    secrets:
      MUTATION_GATE_READ_AWS_ACCESS_KEY_ID: ${{ secrets.MUTATION_GATE_READ_AWS_ACCESS_KEY_ID }}
      MUTATION_GATE_READ_AWS_SECRET_ACCESS_KEY: ${{ secrets.MUTATION_GATE_READ_AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # The one check main requires, whichever caller ran: the early caller's
  # verdict where it planned, else the map caller's. `ci.check` names it, so
  # `passed`, `lastRun` and the trust of merged pull requests read one name
  # (ADR-0135). A skipped caller's own verdict check is required by nothing.
  mutation-verdict:
    name: mutation verdict
    needs: [scope, mutation-early, mutation]
    if: ${{ !cancelled() && needs.scope.outputs.judged != 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pass only where the caller that ran passed
        env:
          RAN_EARLY: ${{ needs.mutation-early.result }}
          WAITS: ${{ needs.mutation-early.outputs.waits }}
          EARLY: ${{ needs.mutation-early.outputs.verdict }}
          LATE: ${{ needs.mutation.outputs.verdict }}
        run: |
          set -euo pipefail
          if [ "${RAN_EARLY}" = "skipped" ] || [ "${WAITS}" = "true" ]; then verdict="${LATE}"; else verdict="${EARLY}"; fi
          echo "The mutation verdict is ${verdict:-missing}."
          [ "${verdict}" = "passed" ]
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py mutation-verdict

  # The newest merged pull requests, each planned again by this checkout's gate
  # with the map `tests` wrote and main's cached ledger (replay.py): it fails
  # where a plan widens for no changed path, or documentation reaches a unit.
  # The night runs it, and so does a pull request that changes reach or plans.
  replay:
    name: replay
    needs: [scope, tests]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.tests.result == 'success' && (needs.scope.result != 'success' || contains(fromJSON(needs.scope.outputs.jobs || '[]'), 'replay')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # The cache prefix main's verdict keeps its ledger under (gate_action.py).
      - id: ledger
        run: echo "prefix=mutation-gate-ledger-$(printf %s refs/heads/main | sha256sum | cut -d' ' -f1)-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-gate/ledger/refs/heads/main
          key: ${{ steps.ledger.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.ledger.outputs.prefix }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-gate-map
          path: .mutation-gate/map
      - id: replay
        run: python3 .github/scripts/replay.py 10 --map .mutation-gate/map --findings evidence/raw/replay.json --table evidence/replay.md
      - name: the replays
        if: ${{ !cancelled() && hashFiles('evidence/replay.md') != '' }}
        run: cat evidence/replay.md >> "$GITHUB_STEP_SUMMARY"
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py replay
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-replay
          path: evidence/replay*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py replay

  # SonarCloud, fed the reports `tests` wrote rather than running the suite a
  # second time. A pull request from a fork or from Dependabot is given no
  # SONAR_TOKEN, so there is nothing to scan with and the job is skipped.
  sonar:
    name: sonarcloud
    needs: coverage
    if: ${{ !cancelled() && needs.coverage.result == 'success' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud reads history to attribute an issue to the change that
          # introduced it, which is what makes "new code" a usable gate.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage
      # `sonar.qualitygate.wait` holds the step until SonarCloud has processed
      # the analysis, so the counts `gate` reads are this commit's.
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py sonar

  # Zero issues, which SonarCloud's free quality gate cannot express: the
  # issues this pull request brings and those open against main, each refused
  # above zero. `!cancelled()`, so a failed scan leaves this job running to
  # say there is nothing to read, and fail.
  gate:
    name: gate
    needs: [tests, sonar]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SCAN: ${{ needs.sonar.result }}
          TESTS: ${{ needs.tests.result }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        id: count
        run: bash .github/scripts/sonar_gate.sh
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-gate
          path: evidence/gate*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py gate

  # Every job's evidence, gathered into the one artifact `evidence` the bot
  # reads when the run is over (ADR-0019). A job that did not run left none;
  # in an attempt run again, a job not run again keeps an earlier one's.
  evidence:
    name: evidence
    needs: [scope, scripts, alone, hygiene, site, rules, guards, checks, tests, coverage, lowest, phar, image, runner-contract, runner-contracts, end-to-end, outbreak, mutation-early, mutation, mutation-verdict, replay, sonar, gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: ./.github/actions/evidence # zizmor: ignore[self-repository]
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py evidence
