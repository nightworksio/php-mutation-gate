# Throwaway diagnostic: replay self-gate shard 4 of run 37710035027 with each own run's time and output logged.
name: diag-own-run
on:
  push:
    branches: ['diag/own-run-exit']
permissions:
  contents: read
  actions: read
jobs:
  shard4:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ab78564d65864391f507144b6f88ca5bb94d6a0b
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagtools
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-gate-plan
          path: .mutation-gate
          run-id: 37710035027
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-gate-coverage
          path: .mutation-gate/coverage
          run-id: 37710035027
          github-token: ${{ github.token }}
      - run: find .mutation-gate/coverage -mindepth 1 -maxdepth 1 -type d ! -name "shard-4" -exec rm -rf {} +
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: |
          set -euo pipefail
          bin/mutation-gate pest:patch
          python3 diagtools/.github/diag_instrument.py
          nproc; php -i | grep -iE "opcache.enable_cli|pcov.enabled|memory_limit" || true
          echo "PHP_INI_SCAN_DIR=${PHP_INI_SCAN_DIR:-unset}"; php --ini | head -5
      - name: Run shard 4 for a while
        continue-on-error: true
        timeout-minutes: 25
        env:
          DIAG_SHARD_LOG: /tmp/shard.log
        run: bin/mutation-gate run --plan=.mutation-gate/plan.json --shard=4 --results=.mutation-gate/results -v
      - name: Show
        if: always()
        run: |
          python3 -c "import json;d=json.load(open('.mutation-gate/results/4.json'));print({k:(len(v) if isinstance(v,(list,dict)) else v) for k,v in d.items()});print(json.dumps(d.get('skipped'))[:3000]);print(json.dumps(d.get('measured'))[:1500])" || true
          test -f /tmp/shard.log || { echo "no log"; exit 0; }
          grep -c '^=== ' /tmp/shard.log || true
          grep '^=== ' /tmp/shard.log | awk '{print $2}' | sort | uniq -c
          grep '^=== ' /tmp/shard.log | head -60
          grep -m1 '^CMD ' /tmp/shard.log | cut -c1-3000
          python3 - <<'PY'
          text = open('/tmp/shard.log').read()
          shown = 0
          for block in text.split('=== ')[1:]:
              if block.startswith('timeout') and shown < 6:
                  shown += 1
                  print('##########', block[:6000])
          PY
