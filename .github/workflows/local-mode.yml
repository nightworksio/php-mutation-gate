# The local loop on a pinned project (ADR-0120, ADR-0146): lcobucci/jwt,
# prepared as bench/jwt.sh prepares it for the benchmark, with the gate from
# this checkout.
#
# - local mode: a whole `run` at half the machine's cores, outside any CI as
#   on a developer's machine, ends within RUN_SECONDS.
# - local loop: the local settings in force are the tight ones the gate
#   ships (ADR-0159), and a `watch` round that starts from a map carried
#   from an earlier measure (`--from-map`), after one source line changed,
#   is quick under `local.cpu: balanced` and ends within LOOP_SECONDS,
#   outside any CI as on a developer's machine; it prints its whole report.
#
# Each budget is scaled to the runner first: `mutation-gate machine`
# times jwt's own suite under plain PHPUnit with pcov, a child process with
# none of the gate's code, and runner_scale.py scales by its ratio to
# RUNNER_REFERENCE_SECONDS, from 1 up to RUNNER_MOST_SCALE, past which the
# job fails as on too slow a runner. A whole run is also stopped as stuck
# where one of its processes uses no CPU for NO_PROGRESS_SECONDS, a bound no
# runner scales.
name: local mode

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.5'
  JWT: ${{ github.workspace }}/../jwt
  # The most seconds a whole run on jwt may take: 84 s measured on CI.
  RUN_SECONDS: 100
  # The most seconds one quick round on jwt may take: 4 s measured on CI.
  LOOP_SECONDS: 10
  # The seconds jwt's suite under pcov takes on the fastest hosted runner
  # measured, the EPYC 9V45 (Xeon 6975P-C 0.42, EPYC 9V74 0.47, Xeon Platinum
  # 8573C 0.55, EPYC 7763 0.63), on which a whole run takes 77 s. A whole run
  # slows by more than the suite does (the 7763: 143 s, 1.9 times, where the
  # suite takes 1.8 times), so the fastest runner is the reference and every
  # other keeps a margin. Re-measure it when jwt's pin, PHP or the hosted
  # fleet changes: the "this runner, timed" step prints the time and the
  # processor of every run.
  RUNNER_REFERENCE_SECONDS: 0.35
  # The most a slow runner scales a budget by; a slower runner fails the job.
  # The slowest hosted CPU measured, the EPYC 7763, scales by about 1.8.
  RUNNER_MOST_SCALE: 2.5
  # The most seconds a process of a whole run may use no CPU before the run
  # is stopped as stuck. It is not scaled: a slower runner takes longer to do
  # the work, never longer to do nothing.
  NO_PROGRESS_SECONDS: 30

jobs:
  local-mode:
    name: local mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          extensions: pcntl, sodium
          # jwt's tests expect assertions to run, as a development PHP has them.
          ini-values: zend.assertions=1
      - name: the project at its pinned commit, prepared
        run: bench/prepare.sh jwt "${JWT}"
      - name: this runner, timed
        working-directory: ${{ env.JWT }}
        run: >-
          vendor/bin/mutation-gate machine --
          php -d pcov.enabled=1 vendor/bin/phpunit --coverage-php=/dev/null --do-not-cache-result
          | python3 "${GITHUB_WORKSPACE}/.github/scripts/runner_scale.py" RUN_SECONDS
      - name: a whole run at half the cores
        id: whole-run
        working-directory: ${{ env.JWT }}
        run: |
          half=$(( $(nproc) / 2 > 0 ? $(nproc) / 2 : 1 ))
          jq --argjson processes "${half}" '.runner.processes = $processes' bench-phpunit.json > bench-local.json
          cp bench-baseline.json mutation-gate.baseline.json
          started=${SECONDS}
          status=0
          timeout "${RUN_SECONDS_SCALED}" env -u CI -u GITHUB_ACTIONS -u GITHUB_EVENT_NAME -u GITHUB_EVENT_PATH \
            -u GITHUB_BASE_REF -u GITHUB_HEAD_REF \
            vendor/bin/mutation-gate run --no-interaction --config=bench-local.json &
          run=$!
          python3 "${GITHUB_WORKSPACE}/.github/scripts/progress_watch.py" "${run}" "${NO_PROGRESS_SECONDS}" stuck.txt &
          wait "${run}" || status=$?
          wait
          took=$(( SECONDS - started ))
          echo "local mode: \`run\` on lcobucci/jwt at ${half} processes took ${took} s and ended ${status}." >> "${GITHUB_STEP_SUMMARY}"
          if [ -s stuck.txt ]; then
            echo "::error title=local mode::A whole run at ${half} processes stopped: $(cat stuck.txt)"
            exit 1
          fi
          if [ "${status}" -eq 124 ]; then
            echo "::error title=local mode::A whole run at ${half} processes took more than ${RUN_SECONDS_SCALED} s: slow runner (${RUNNER_CPU}), factor ${RUNNER_SCALE}, budget ${RUN_SECONDS_SCALED} s of a base ${RUN_SECONDS} s."
          fi
          exit "${status}"
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py local-mode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-local-mode
          path: evidence/local-mode*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py local-mode

  local-loop:
    name: local loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          extensions: pcntl, sodium
          # jwt's tests expect assertions to run, as a development PHP has them.
          ini-values: zend.assertions=1
      - name: the project at its pinned commit, prepared
        run: bench/prepare.sh jwt "${JWT}"
      - name: a map measured on the committed project
        working-directory: ${{ env.JWT }}
        run: |
          jq '.local.cpu = "balanced"' bench-phpunit.json > bench-local.json
          env -u CI -u GITHUB_ACTIONS -u GITHUB_EVENT_NAME -u GITHUB_EVENT_PATH -u GITHUB_BASE_REF -u GITHUB_HEAD_REF \
            vendor/bin/mutation-gate coverage --no-interaction --config=bench-local.json --into=.mutation-gate/carried
      - name: the tight local settings in force
        working-directory: ${{ env.JWT }}
        run: |
          local=$(env -u CI -u GITHUB_ACTIONS vendor/bin/mutation-gate config:show --resolved --format=json \
            --config=bench-local.json 2>/dev/null | jq -c '.local | {watchBudget, prePushBudget, quick, changeOnly}')
          expected='{"watchBudget":"30s","prePushBudget":"2m","quick":true,"changeOnly":true}'
          if [ "${local}" != "${expected}" ]; then
            echo "::error title=local loop::The local settings in force are ${local}, not ${expected}."
            exit 1
          fi
      - name: this runner, timed
        working-directory: ${{ env.JWT }}
        run: >-
          vendor/bin/mutation-gate machine --
          php -d pcov.enabled=1 vendor/bin/phpunit --coverage-php=/dev/null --do-not-cache-result
          | python3 "${GITHUB_WORKSPACE}/.github/scripts/runner_scale.py" LOOP_SECONDS
      - name: one quick round after a source line changed
        id: round
        working-directory: ${{ env.JWT }}
        run: |
          file=src/Validation/Constraint/IdentifiedBy.php
          sed -i "s/if (! \$token->isIdentifiedBy(\$this->id)) {/if (\$token->isIdentifiedBy(\$this->id) === false) {/" "${file}"
          if git diff --quiet -- "${file}"; then
            echo "::error title=local loop::The pinned line of ${file} is not there to change."
            exit 1
          fi
          started=${SECONDS}
          status=0
          timeout "${LOOP_SECONDS_SCALED}" env -u CI -u GITHUB_ACTIONS -u GITHUB_EVENT_NAME -u GITHUB_EVENT_PATH \
            -u GITHUB_BASE_REF -u GITHUB_HEAD_REF \
            vendor/bin/mutation-gate watch --no-interaction --config=bench-local.json \
            --rounds=1 --from-map=.mutation-gate/carried --whole-report || status=$?
          took=$(( SECONDS - started ))
          echo "local loop: a round from the carried map took ${took} s and ended ${status}." >> "${GITHUB_STEP_SUMMARY}"
          if [ "${status}" -eq 124 ]; then
            echo "::error title=local loop::A quick round from a carried map took more than ${LOOP_SECONDS_SCALED} s."
          fi
          exit "${status}"
      # The job's evidence, whatever the steps above did (ADR-0019).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py local-loop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-local-loop
          path: evidence/local-loop*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py local-loop

  # The jobs' evidence, gathered into the one artifact the bot reads (ADR-0019).
  local-evidence:
    name: local evidence
    needs: [local-mode, local-loop]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: ./.github/actions/evidence # zizmor: ignore[self-repository]
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py local-evidence
