# Outbreak's core built for every platform the package ships it for
# (ADR-0118): Linux, static against musl, on x86_64 and aarch64; macOS on both;
# and Windows on x86_64. Each binary answers `outbreak contract` where it is
# built, and is uploaded as `outbreak-<platform>`, with its SHA-256 beside it.
# Called by ci.yml where `what changed` lists `outbreak-build`, and by
# release.yml, whose draft lays every binary under resources/outbreak with
# the SHA256SUMS the gate checks each one against.
name: outbreak build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            binary: outbreak
          - platform: linux-aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            binary: outbreak
          - platform: darwin-x86_64
            target: x86_64-apple-darwin
            runner: macos-15
            binary: outbreak
          - platform: darwin-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
            binary: outbreak
          - platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: outbreak.exe
    defaults:
      run:
        shell: bash
        working-directory: outbreak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "${TARGET}"
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --package outbreak --target "${TARGET}"
      - name: Answer the contract, and keep the binary with its SHA-256
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          built="target/${TARGET}/release/${BINARY}"
          said="$("${built}" contract)"
          if [[ "${said}" != *'"outbreak":1'* ]]; then
            echo "::error::${built} answered ${said}, not contract 1."
            exit 1
          fi
          mkdir -p "dist/${PLATFORM}"
          cp "${built}" "dist/${PLATFORM}/${BINARY}"
          cd dist
          if command -v sha256sum > /dev/null; then
            sha256sum "${PLATFORM}/${BINARY}" > "${PLATFORM}/SHA256SUM"
          else
            shasum -a 256 "${PLATFORM}/${BINARY}" > "${PLATFORM}/SHA256SUM"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outbreak-${{ matrix.platform }}
          path: outbreak/dist
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        working-directory: .
        run: python3 .github/scripts/gate_summary.py outbreak-build/build
