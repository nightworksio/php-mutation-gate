# Outbreak's core, the Rust workspace under outbreak/ (ADR-0118), held to
# herald's standard: formatting, clippy pedantic with every warning denied on
# every target, the suite, every line covered, the dependency audits, the
# oldest supported toolchain, every mutant caught in shards, each parser
# fuzzed, and the boundary: the PHP contract suite of the map engine run
# against the binary this commit builds. Called by ci.yml where `what changed`
# lists `outbreak`: on a pull request that reaches the Rust tree or its PHP
# boundary, and on every push to main and every night. A pull request mutates
# what its diff touches and fuzzes each target for a minute; main and the
# night mutate the whole workspace and the night fuzzes for half an hour.
name: outbreak

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PHP_VERSION: '8.5'

defaults:
  run:
    working-directory: outbreak

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path fuzz/Cargo.toml
      - name: what failed
        if: failure()
        working-directory: .
        run: python3 .github/scripts/gate_summary.py outbreak/fmt

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            outbreak/target
          key: outbreak-clippy-${{ hashFiles('outbreak/rust-toolchain.toml', 'outbreak/Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: what failed
        if: failure()
        working-directory: .
        run: python3 .github/scripts/gate_summary.py outbreak/clippy

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            outbreak/target
          key: outbreak-test-${{ hashFiles('outbreak/rust-toolchain.toml', 'outbreak/Cargo.lock') }}
      - run: ci/install-tool.sh cargo-nextest
      - run: cargo nextest run --workspace --locked
      - name: what failed
        if: failure()
        working-directory: .
        run: python3 .github/scripts/gate_summary.py outbreak/test

  # Every line of the workspace, the binary's own included: its integration
  # tests run the binary built for coverage.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            outbreak/target
          key: outbreak-coverage-${{ hashFiles('outbreak/rust-toolchain.toml', 'outbreak/Cargo.lock') }}
      - run: ci/install-tool.sh cargo-nextest
      - run: ci/install-tool.sh cargo-llvm-cov
      - run: cargo llvm-cov nextest --workspace --locked --fail-under-lines 100 --show-missing-lines
      - name: what failed
        if: failure()
        working-directory: .
        run: python3 .github/scripts/gate_summary.py outbreak/coverage

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/install-tool.sh cargo-deny
      - run: cargo deny --locked check
      - run: cargo deny --locked --manifest-path fuzz/Cargo.toml check
      - name: what failed
        if: failure()
        working-directory: .
        run: python3 .github/scripts/gate_summary.py outbreak/deny

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/install-tool.sh cargo-audit
      - run: cargo audit --deny warnings
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock
      - name: what failed
        if: failure()
        working-directory: .
        run: python3 .github/scripts/gate_summary.py outbreak/audit

  # The oldest toolchain the workspace promises, `rust-version` in Cargo.toml.
  # RUSTUP_TOOLCHAIN takes precedence over rust-toolchain.toml, which would
  # otherwise hand this job the pinned toolchain.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          declared=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$declared" != "$RUSTUP_TOOLCHAIN" ]; then
            echo "::error::Cargo.toml declares rust-version ${declared}, and this job tests ${RUSTUP_TOOLCHAIN}"
            exit 1
          fi
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            outbreak/target
          key: outbreak-msrv-${{ hashFiles('outbreak/Cargo.toml', 'outbreak/Cargo.lock') }}
      - run: cargo test --workspace --locked
      - name: what failed
        if: failure()
        working-directory: .
        run: python3 .github/scripts/gate_summary.py outbreak/msrv

  # Any missed mutant fails its shard.
  mutants:
    name: mutants ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: outbreak-mutants-${{ hashFiles('outbreak/rust-toolchain.toml', 'outbreak/Cargo.lock') }}
      - run: ci/install-tool.sh cargo-nextest
      - run: ci/install-tool.sh cargo-mutants
      - env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          scope=()
          if [ "$EVENT" = "pull_request" ]; then
            git diff "$(git merge-base "$BASE" HEAD)" HEAD -- . > "${RUNNER_TEMP}/change.diff"
            scope=(--in-diff "${RUNNER_TEMP}/change.diff")
          fi
          cargo mutants --workspace --no-shuffle --shard "${SHARD}/${SHARDS}" "${scope[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: outbreak-mutants-${{ matrix.shard }}
          path: outbreak/mutants.out
          retention-days: 7
      - name: what failed
        if: failure()
        working-directory: .
        run: python3 .github/scripts/gate_summary.py outbreak/mutants

  # Every parser and decoder: a map's text, a split request, and a slice of
  # a map the slicer takes, which must itself be a map it vouches for.
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The fuzz harness builds with a sanitizer, which needs nightly. Pinned,
      # so a nightly that breaks the build is a reviewed bump.
      RUSTUP_TOOLCHAIN: nightly-2026-10-29
    strategy:
      fail-fast: false
      matrix:
        target: [map, request, slice]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: ci/install-tool.sh cargo-fuzz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: outbreak/fuzz/corpus/${{ matrix.target }}
          key: outbreak-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: outbreak-fuzz-corpus-${{ matrix.target }}-
      - env:
          TARGET: ${{ matrix.target }}
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '1800' || '60' }}
        working-directory: outbreak/fuzz
        run: cargo fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time="$SECONDS_TO_RUN" -dict=outbreak.dict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: outbreak-fuzz-artifacts-${{ matrix.target }}
          path: outbreak/fuzz/artifacts
          retention-days: 7
      - name: what failed
        if: failure()
        working-directory: .
        run: python3 .github/scripts/gate_summary.py outbreak/fuzz

  # The map engine's PHP contract suite and the adapter's own tests, run
  # against the binary this commit builds: what the binary answers is what
  # the gate's PHP gives.
  boundary:
    name: boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            outbreak/target
          key: outbreak-boundary-${{ hashFiles('outbreak/rust-toolchain.toml', 'outbreak/Cargo.lock') }}
      - run: cargo build --release --locked --package outbreak
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - working-directory: .
        env:
          OUTBREAK_BINARY: ${{ github.workspace }}/outbreak/target/release/outbreak
        run: vendor/bin/pest tests/Contract/MapEngine tests/Process/Adapter/Outbreak
      - name: what failed
        if: failure()
        working-directory: .
        run: python3 .github/scripts/gate_summary.py outbreak/boundary
