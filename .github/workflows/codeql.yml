# CodeQL over the workflows and, once they exist, the reusable workflow and
# action.yml. CodeQL has no PHP analysis, so `actions` is the language it has
# to read here, and the workflows are where injection and supply-chain flaws
# live.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 2"

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head. Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether the change reaches anything the analysis reads. The Actions analysis
  # reads workflows and action metadata, never documentation, so a change of
  # Markdown, `.docs/` or `LICENSE` alone skips it. Anything else runs it, and so
  # does a change with no base to compare against or a scope that did not
  # succeed. A skipped `analyze` still reports, as skipped.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: diff
        env:
          # A pull request is measured against its base, and a push to main
          # against the commit before it. A schedule has neither.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit, so the analysis runs."
            exit 0
          fi
          changed="$(git diff --no-renames --name-only "${BASE}" HEAD)"
          code=false
          while IFS= read -r path; do
            case "${path}" in
            '' | *.md | .docs/* | LICENSE) ;;
            *) code=true ;;
            esac
          done <<< "${changed}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = false ]; then
            echo "Documentation only; the analysis is skipped."
          fi

  analyze:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:actions"
