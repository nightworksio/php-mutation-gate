# The benchmark (ADR-0017, decisions 14 to 17): each pinned project, prepared
# here and never changed upstream, run by every arm on one GitHub-hosted
# machine, interleaved, three times; each arm's mutants reconciled per file
# and status. On demand and monthly, never on pull requests.
name: bench

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions: {}

# One benchmark at a time, so no two share the account's runners.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PHP_VERSION: '8.5'

jobs:
  # lcobucci/jwt, the small library: plain Infection with the project's own
  # config, the gate mutating with that Infection and those mutators, and
  # the gate mutating with its own engine and forked PHPUnit workers. The
  # first two make the same mutants, so they are reconciled one by one.
  jwt:
    name: lcobucci/jwt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 300
    env:
      PROJECT: bench/jwt.json
      # The library's archive holds no version for Composer to read.
      COMPOSER_ROOT_VERSION: "5.6.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          extensions: pcntl, sodium
          # jwt's tests expect assertions to run, as a development PHP has them.
          ini-values: zend.assertions=1
      - name: lcobucci/jwt, at its pinned tag, commit and tree
        run: |
          set -euo pipefail
          version=$(jq -r .version "${PROJECT}")
          commit=$(jq -r .commit "${PROJECT}")
          tree=$(jq -r .tree "${PROJECT}")
          src="${RUNNER_TEMP}/jwt-src"
          git clone --quiet --depth 1 --branch "${version}" https://github.com/lcobucci/jwt.git "${src}"
          test "$(git -C "${src}" rev-parse HEAD)" = "${commit}"
          # A repository's info/attributes is read before its tree's own.
          printf '* -export-ignore -export-subst\n' > "${src}/.git/info/attributes"
          git -C "${src}" archive --format=tar HEAD > "${RUNNER_TEMP}/jwt.tar"
          sha256sum --check --strict <<<"${tree}  ${RUNNER_TEMP}/jwt.tar"
          mkdir "${RUNNER_TEMP}/jwt"
          tar xf "${RUNNER_TEMP}/jwt.tar" -C "${RUNNER_TEMP}/jwt"
      # The gate from this checkout, and the Infection and PHPUnit its lock
      # holds, so both arms that mutate with Infection run the same release.
      - name: install the gate, Infection and PHPUnit as this checkout locks them
        working-directory: ${{ runner.temp }}/jwt
        run: |
          set -euo pipefail
          locked() {
            jq -r --arg name "$1" '(.packages + ."packages-dev")[] | select(.name == $name) | .version' \
              "${GITHUB_WORKSPACE}/composer.lock"
          }
          jq --arg gate "${GITHUB_WORKSPACE}" --arg phpunit "$(locked phpunit/phpunit)" \
            --arg infection "$(locked infection/infection)" '
            .["require-dev"] = {
              "lcobucci/clock": .["require-dev"]["lcobucci/clock"],
              "phpunit/phpunit": $phpunit,
              "infection/infection": $infection,
              "nightworksio/mutation-gate": "@dev"
            }
            | del(.config.platform)
            | .config["allow-plugins"] = {"infection/extension-installer": false}
            | .repositories = [{"type": "path", "url": $gate, "options": {"symlink": true}}]
            | .["minimum-stability"] = "dev"
            | .["prefer-stable"] = true' composer.json > composer.json.new
          mv composer.json.new composer.json
          composer update --no-interaction --no-progress
          composer show | grep -E '^(phpunit/phpunit|infection/infection|nightworksio/mutation-gate) '
          # jwt's own PHPUnit is 11; PHPUnit 13 warns of its repeated
          # `#[Uses]` attributes and refuses `beStrictAboutTodoAnnotatedTests`.
          sed -e 's/failOnRisky="true"/failOnRisky="true" failOnPhpunitWarning="false" failOnPhpunitDeprecation="false"/' \
            -e 's/ *beStrictAboutTodoAnnotatedTests="true"//' phpunit.xml.dist > phpunit.xml
          printf 'vendor/\n.mutation-gate/\nbench-*.json\ninfection.txt\n' > .gitignore
          # The gate's arms start from floors of 0, so a score never fails them.
          printf '{"format": 1, "trees": {"src": {"floor": 0}}, "security": {".": {"floor": 0}}}\n' > bench-baseline.json
          printf '{"runner": {"use": "infection"}, "trees": [{"path": "src"}]}\n' > bench-infection.json
          # Plain Infection writes its JSON log only where its config names one.
          jq '.logs.json = "bench-infection-log.json"' infection.json.dist > bench-plain-infection.json
          printf '{"runner": {"use": "phpunit", "workers": "fork"}, "trees": [{"path": "src"}]}\n' > bench-phpunit.json
          git init --quiet
          git add --all
          git -c user.name=bench -c user.email=bench@localhost commit --quiet --message "lcobucci/jwt"
          # Plain Infection runs in a copy made before the gate patches its own.
          cp -a "${RUNNER_TEMP}/jwt" "${RUNNER_TEMP}/jwt-plain"
          vendor/bin/mutation-gate infection:patch
      - name: run every arm, interleaved, three times
        run: python3 .github/scripts/bench.py run "${PROJECT}" "${RUNNER_TEMP}/jwt" "${RUNNER_TEMP}/bench" --rounds 3
      - name: reconcile the arms
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/bench.py reconcile "${PROJECT}" "${RUNNER_TEMP}/jwt" "${RUNNER_TEMP}/bench" \
            bench/results/jwt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: bench-jwt
          path: |
            bench/results/jwt.json
            ${{ runner.temp }}/bench
          if-no-files-found: error
          retention-days: 90

  # What starting Pest costs on this machine class: the gate's own suite
  # started ten times with a filter no test matches. Each of the gate's own
  # mutants under Pest pays it once, so it is the floor of a mutant's time.
  pest-start-up:
    name: Pest start-up
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: start Pest ten times with no test to run
        run: |
          python3 .github/scripts/bench.py time 10 bench/results/pest-start-up.json -- \
            php vendor/pestphp/pest/bin/pest --filter=NoTestIsNamedThis --no-coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: bench-pest-start-up
          path: bench/results/pest-start-up.json
          if-no-files-found: error
          retention-days: 90
