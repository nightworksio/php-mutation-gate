# A pull request's record and its text: the commits, the title and the body.
# It runs on `edited` as well, so a title or body that is fixed is checked at
# once, and it runs no PHP (ADR-0019, decision 12). The squash merge makes the
# title and the body main's commit, which is why they are held here.
name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

# An edit or a push supersedes the run on the text or the head before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The record of every commit a pull request brings: no tool is credited for
  # it, and its subject is conventional. Each reads the pull request's
  # base..head.
  attribution:
    name: attribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The body as well as the commits, because a squash merge writes the pull
      # request's title and body into the commit that lands on main.
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        id: check
        run: |
          mkdir -p evidence/raw
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" \
            | python3 .github/scripts/attribution_check.py "${BASE_SHA}" "${HEAD_SHA}" --body-on-stdin \
              --findings evidence/raw/attribution.json
      # The job's evidence, whatever the steps above did (ADR-0019, decision 5).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py attribution
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: evidence-attribution
          path: evidence/attribution*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py attribution

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        id: check
        run: |
          mkdir -p evidence/raw
          python3 .github/scripts/commit_lint.py "${BASE_SHA}" "${HEAD_SHA}" --title "${PR_TITLE}" \
            --findings evidence/raw/commitlint.json
      # The job's evidence, whatever the steps above did (ADR-0019, decision 5).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py commitlint
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: evidence-commitlint
          path: evidence/commitlint*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py commitlint

  # What the body promises: every `Spec:` names a decision in .docs/decisions,
  # and a breaking title has a *Migration* section. Its evidence also carries
  # the suggestions the bot shows: a conventional title from the changed paths,
  # and the decisions .github/spec-map.json maps them to.
  description:
    name: description
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        id: check
        run: |
          mkdir -p evidence/raw
          python3 .github/scripts/pr_text.py "${BASE_SHA}" "${HEAD_SHA}" --findings evidence/raw/description.json
      # The job's evidence, whatever the steps above did (ADR-0019, decision 5).
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py description
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: evidence-description
          path: evidence/description*
          if-no-files-found: error
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py description

  # Every job's evidence, gathered into the one artifact `evidence` of this
  # run, which the bot reads beside the ci run's (ADR-0019, decision 5).
  pr-evidence:
    name: pr evidence
    needs: [attribution, commitlint, description]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence
          pattern: evidence-*
          delete-merged: true
          retention-days: 7
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py pr-evidence
