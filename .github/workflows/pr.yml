# A pull request's record and its text: the commits, the title and the body.
# It runs on `edited` as well, so a title or body that is fixed is checked at
# once, and it runs no PHP (ADR-0019). The squash merge makes the
# title and the body main's commit, which is why they are held here.
name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

# An edit or a push supersedes the run on the text or the head before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The record of every commit a pull request brings: its subject is
  # conventional, reading the pull request's base..head. And what the body
  # promises: every `Spec:` names a decision in .docs/decisions, and a breaking
  # title has a *Migration* section. Its evidence also carries the suggestions
  # the bot shows: a conventional title from the changed paths, and the
  # decisions .github/spec-map.json maps them to. All of it is gathered into the
  # one artifact `evidence` of this run, which the bot reads beside the ci
  # run's (ADR-0019), over what an earlier attempt gathered.
  pr:
    name: pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mkdir -p evidence/raw
      - id: commitlint
        run: |
          python3 .github/scripts/commit_lint.py "${BASE_SHA}" "${HEAD_SHA}" --title "${PR_TITLE}" \
            --findings evidence/raw/commitlint.json
      - id: description
        if: ${{ !cancelled() }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/pr_text.py "${BASE_SHA}" "${HEAD_SHA}" --findings evidence/raw/description.json
      # The job's evidence, whatever the steps above did.
      - name: evidence
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python3 .github/scripts/evidence.py pr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-pr
          path: evidence/pr*
          if-no-files-found: error
          retention-days: 7
      - uses: ./.github/actions/evidence # zizmor: ignore[self-repository]
        if: ${{ !cancelled() }}
      - name: what failed
        if: failure()
        run: python3 .github/scripts/gate_summary.py pr
