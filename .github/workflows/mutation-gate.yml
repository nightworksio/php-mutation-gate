# Generated from scripts/workflows/mutation-gate/ by `python3 scripts/workflows/generate.py`: edit the template and run it again.

name: mutation-gate

# The sharded gate, called with workflow_call: a plan job, one job per shard, a
# verdict job, which is the check a branch protects, and on the default branch
# a job that publishes the badge and trend (ADR-0011).
#
# The plan, the shards and the verdict run the project's own code, so they
# hold no token that can write, and no secret but the credentials Composer
# installs the project with, which their install steps alone read (ADR-0029).
# What needs a credential happens in fetch, deliver-plan, deliver-survivors
# and deliver, which run none of it, from the gate's own installation at this
# workflow's commit, installed from resources/action/keyed's lock (ADR-0007).
#
# The shard jobs run the action from this workflow's own commit, which each
# checks out at job.workflow_sha, so the workflow and the action are always
# one version.
#
# Each artifact one job hands another is named with the attempt of the job
# that wrote it, its `attempt` output, and a shard's result with its plan's, so
# a re-run reads what it and the jobs it kept wrote, never an older attempt's.
#
# A calling job grants what its called jobs ask for, or the run does not
# start: contents: write (publish, which runs on the default branch only),
# actions: read (verdict and deliver), pull-requests: write (the deliver
# jobs) and id-token: write (fetch and deliver). It passes each secret
# declared below under its own name, read from its own secrets by that name;
# the store's values stay in the two environments, and COMPOSER_AUTH is a
# repository secret, since every job that installs the project reads it.

on:
  workflow_call:
    inputs:
      config:
        description: The config file, where the gate should not look for one.
        type: string
        default: ''
      php-version:
        description: The PHP version to set up.
        type: string
        default: '8.5'
      extensions:
        description: 'PHP extensions to set up besides the defaults, as setup-php takes them, such as "zstd, intl".'
        type: string
        default: ''
      ini-values:
        description: 'PHP ini values to set, as setup-php takes them, such as "memory_limit=2G, opcache.enable_cli=1".'
        type: string
        default: ''
      runner:
        description: pest, infection, phpunit, phpspec, codeception, testo or a registered runner's name; the config's, or zero-config's, where empty.
        type: string
        default: ''
      mode:
        description: auto, full, changed, sampled or unproven.
        type: string
        default: auto
      changed-since:
        description: A git ref, or last-passed; where empty, on pull_request the commit its merge checkout merges it onto (its base where the checkout is no merge), the group's base on merge_group, the default branch on another branch, and last-passed on the default branch.
        type: string
        default: ''
      budget:
        description: How long the run may take, such as 15m or 1h30m.
        type: string
        default: ''
      reports:
        description: '<name>:<path> lines, each added as --report.'
        type: string
        default: ''
      cache:
        description: Keep the proof ledger in the Actions cache.
        type: boolean
        default: true
      merged-records:
        description: >-
          Keep each pull request's pass as an artifact, and read it on the push that merged it, so that
          ci.trustMergedPullRequests finds it where the Actions cache keeps ledgers (ADR-0139).
        type: boolean
        default: false
      merged-records-days:
        description: How many days a pull request's pass stays readable; a merge later than that is judged again.
        type: number
        default: 30
      coverage:
        description: >-
          An artifact of this run that holds map.json.gz, the map `mutation-gate coverage --into` wrote in the job
          that ran the suite under coverage; where empty, the plan runs the suite under coverage itself.
        type: string
        default: ''
      plan-timeout:
        description: How many minutes the plan job may take, which runs the suite under coverage.
        type: number
        default: 60
      shard-timeout:
        description: How many minutes each shard job may take.
        type: number
        default: 360
      verdict-timeout:
        description: How many minutes the verdict job may take.
        type: number
        default: 30
      plan-coverage:
        description: The coverage driver the plan sets up, as setup-php takes it, such as pcov or xdebug.
        type: string
        default: pcov
      publish-branch:
        description: The branch publish writes the badge and the trend to, and the verdict reads the last trend from.
        type: string
        default: mutation-gate
      runs-on:
        description: 'The runner the plan, the shards, the survivors and the verdict run on: a label, such as ubuntu-24.04-arm, or a JSON list of labels a runner must all have, such as ["self-hosted", "linux"].'
        type: string
        default: ubuntu-latest
      keyed-runs-on:
        description: 'The runner fetch, the deliver jobs and publish run on, which hold a key or a token that writes: a label or a JSON list of labels, as runs-on takes. A runner a pull request''s code ran on can keep what that code left for the next job, so name a GitHub-hosted or an ephemeral one.'
        type: string
        default: ubuntu-latest
    # A called job reads an environment's secret only under a name its caller
    # passes (ADR-0029), so each is declared here and passed by name. The value
    # comes from the environment the reading job enters, which wins over what
    # the caller passes. Only fetch and deliver read them, but COMPOSER_AUTH,
    # which only the steps that install the project's dependencies read.
    secrets:
      COMPOSER_AUTH:
        description: The credentials Composer installs the project's dependencies with, for a private repository; read by the install steps alone, never by a step that runs the project's tests or mutants, though an install step runs the project's Composer scripts and plugins, which can read it.
        required: false
      MUTATION_GATE_READ_AWS_ACCESS_KEY_ID:
        description: The key that reads the default branch's ledger, from the environment mutation-gate-read.
        required: false
      MUTATION_GATE_READ_AWS_SECRET_ACCESS_KEY:
        description: The secret of that key, from the environment mutation-gate-read.
        required: false
      AWS_ACCESS_KEY_ID:
        description: The key that writes the default branch's ledger, from the environment mutation-gate-store.
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: The secret of that key, from the environment mutation-gate-store.
        required: false
      AWS_SESSION_TOKEN:
        description: The session token of a temporary key, from the environment mutation-gate-store.
        required: false
      MUTATION_GATE_SLACK_URL:
        description: The Slack webhook alerts go to, from the environment mutation-gate-store.
        required: false
      MUTATION_GATE_DISCORD_URL:
        description: The Discord webhook alerts go to, from the environment mutation-gate-store.
        required: false
      MUTATION_GATE_WEBHOOK_URL:
        description: The webhook alerts go to, from the environment mutation-gate-store.
        required: false
      MUTATION_GATE_WEBHOOK_SECRET:
        description: The secret that signs what the webhook receives, from the environment mutation-gate-store.
        required: false
      OTEL_EXPORTER_OTLP_ENDPOINT:
        description: Where the trace is exported, from the environment mutation-gate-store.
        required: false
      OTEL_EXPORTER_OTLP_HEADERS:
        description: The headers the trace is exported with, from the environment mutation-gate-store.
        required: false
    outputs:
      verdict:
        description: passed, failed or cannot-judge.
        value: ${{ jobs.verdict.outputs.verdict }}
      scores:
        description: 'JSON: each tree''s score, and the new code''s.'
        value: ${{ jobs.verdict.outputs.scores }}
      plan:
        description: 'JSON: the plan, as plan --ci=json prints it.'
        value: ${{ jobs.plan.outputs.plan }}

permissions: {}

env:
  # The directory each job checks this workflow's own repository out into, at
  # the commit it was called at: under .mutation-gate, which the gate leaves
  # out of every change and every proof key.
  GATE_ACTION: .mutation-gate/workflow
  # The branch publish writes the badge and the trend to, and the verdict reads the last trend from.
  PUBLISHED: ${{ inputs.publish-branch }}
  # Where the directory store keeps every scope's ledger: the Actions cache.
  LEDGERS: .mutation-gate/ledger
  # Where fetch writes the store's copy of the default branch's ledger, which
  # the gate reads beside the cache's, as proofs.copies says (ADR-0061).
  FETCHED: .mutation-gate/fetched
  # Where the project's code leaves what deliver sends, by command: planned, survivors and verdict.
  DELIVERY: .mutation-gate/delivery
  # Where the plan finds the map another job of the run handed over, as the `coverage` input names it.
  HANDED: .mutation-gate/handed
  # Where the verdict keeps the error lines of each cancelled or failed job's log, a file a job by its id.
  ERRORS: .mutation-gate/errors

jobs:
  # The default branch's ledger, read where the store needs credentials, which
  # the repository variable MUTATION_GATE_STORE names. Its key reads that
  # branch's prefix and nothing else, and this job installs and runs none of
  # the project's code, so every run may hold it: the environment
  # mutation-gate-read has no branch policy. A fork's pull request is given no
  # secret, and reads through the store's publicUrl instead.
  fetch:
    name: fetch
    if: vars.MUTATION_GATE_STORE != ''
    environment:
      name: mutation-gate-read
      deployment: false
    runs-on: ${{ startsWith(inputs.keyed-runs-on, '[') && fromJSON(inputs.keyed-runs-on) || inputs.keyed-runs-on }}
    timeout-minutes: 10
    # id-token: write lets a store that signs in through GitHub's OIDC, Azure's
    # or GCS's, ask for this job's token, which GitHub hands only to a job
    # granted it; no job that runs the project's code is.
    permissions:
      contents: read
      id-token: write
      actions: read # lists and reads the artifacts of the pull requests merged, under merged-records
      pull-requests: read # names the pull request each commit merged, under merged-records
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.GATE_ACTION }}
          persist-credentials: false
      - name: Name the default branch
        id: default
        env:
          NAMED: ${{ github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${NAMED}" ]; then
            NAMED="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          fi
          echo "name=${NAMED}" >> "${GITHUB_OUTPUT}"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          ini-values: ${{ inputs.ini-values }}
          coverage: none
      - name: Install the gate
        run: bash "${GATE_ACTION}/resources/action/install.sh" "${GATE_ACTION}"
      - name: Fetch the default branch's ledger
        id: fetch
        env:
          MUTATION_GATE_DEFAULT_BRANCH: ${{ steps.default.outputs.name }}
          MUTATION_GATE_STORE: ${{ vars.MUTATION_GATE_STORE }}
          MUTATION_GATE_STORE_BUCKET: ${{ vars.MUTATION_GATE_STORE_BUCKET }}
          MUTATION_GATE_STORE_PREFIX: ${{ vars.MUTATION_GATE_STORE_PREFIX }}
          MUTATION_GATE_STORE_REGION: ${{ vars.MUTATION_GATE_STORE_REGION }}
          MUTATION_GATE_STORE_ENDPOINT: ${{ vars.MUTATION_GATE_STORE_ENDPOINT }}
          MUTATION_GATE_STORE_ACCOUNT: ${{ vars.MUTATION_GATE_STORE_ACCOUNT }}
          MUTATION_GATE_STORE_CONTAINER: ${{ vars.MUTATION_GATE_STORE_CONTAINER }}
          MUTATION_GATE_STORE_PUBLIC_CONTAINER: ${{ vars.MUTATION_GATE_STORE_PUBLIC_CONTAINER }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MUTATION_GATE_READ_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUTATION_GATE_READ_AWS_SECRET_ACCESS_KEY }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          MUTATION_GATE_GCS_PROVIDER: ${{ vars.MUTATION_GATE_GCS_PROVIDER }}
          MUTATION_GATE_GCS_SERVICE_ACCOUNT: ${{ vars.MUTATION_GATE_GCS_SERVICE_ACCOUNT }}
        run: php "${GATE_ACTION}/bin/mutation-gate" fetch --to="${FETCHED}"
      - name: Read what the pull requests merged passed
        if: inputs.merged-records && github.event_name == 'push' && github.ref_name == steps.default.outputs.name
        env:
          DEFAULT_BRANCH: ${{ steps.default.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" merged-records
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-gate-fetched-${{ github.run_attempt }}
          path: ${{ env.FETCHED }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # The plan runs whatever fetch did: the ledger only saves work, and a fetch
  # that failed shows as its own red check.
  plan:
    name: plan
    needs: fetch
    if: ${{ !cancelled() && needs.fetch.result != 'cancelled' }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.plan-timeout }}
    # The comment's planned state goes to deliver-plan.
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      plan: ${{ steps.plan.outputs.plan }}
      stands: ${{ steps.plan.outputs.stands }}
      fail-fast: ${{ steps.config.outputs.fail_fast }}
      survivor-shares: ${{ steps.survivors.outputs.shares }}
      survivor-minutes: ${{ steps.survivors.outputs.minutes }}
      delivery: ${{ steps.delivery.outputs.left }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.GATE_ACTION }}
          persist-credentials: false
      - name: Refuse an event the gate never runs under
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" guard
      # Before the project's dependencies install, so none of its code runs
      # while a step holds the token.
      - name: Name the default branch
        id: default
        env:
          NAMED: ${{ github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${NAMED}" ]; then
            NAMED="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          fi
          echo "name=${NAMED}" >> "${GITHUB_OUTPUT}"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          ini-values: ${{ inputs.ini-values }}
          coverage: ${{ inputs.plan-coverage }}
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - name: Resolve the run
        id: resolve
        env:
          MODE: ${{ inputs.mode }}
          CHANGED_SINCE: ${{ inputs.changed-since }}
          CONFIG: ${{ inputs.config }}
          RUNNER: ${{ inputs.runner }}
          BUDGET: ${{ inputs.budget }}
          REPORTS: ${{ inputs.reports }}
          CACHE: ${{ inputs.cache }}
          DEFAULT_BRANCH: ${{ steps.default.outputs.name }}
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" resolve
      - name: Read the effective config
        id: config
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
          OPTIONS: ${{ steps.resolve.outputs.options }}
          CACHE: ${{ inputs.cache }}
        run: |
          set -euo pipefail
          mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
          "${GATE}" config:show --format=json --resolved "${arguments[@]}" \
            | python3 "${GATE_ACTION}/resources/action/gate_action.py" config
      - name: Restore this scope's ledger
        if: steps.config.outputs.default_store == 'true' && steps.resolve.outputs.own_dir != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.resolve.outputs.own_dir }}
          key: ${{ steps.resolve.outputs.own_prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.resolve.outputs.own_prefix }}
      - name: Restore the default branch's ledger
        if: steps.config.outputs.default_store == 'true' && steps.resolve.outputs.default_dir != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.resolve.outputs.default_dir }}
          key: ${{ steps.resolve.outputs.default_prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.resolve.outputs.default_prefix }}
      # The store's copy of the ledger fetch read, where it wrote one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-fetched
        timeout-minutes: 2
        continue-on-error: true
        with:
          pattern: mutation-gate-fetched-${{ needs.fetch.outputs.attempt }}
          path: ${{ env.FETCHED }}
          merge-multiple: true
      - name: Retry downloading the store's copy of the ledger
        if: steps.download-fetched.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          pattern: mutation-gate-fetched-${{ needs.fetch.outputs.attempt }}
          path: ${{ env.FETCHED }}
          merge-multiple: true
      # The map the job that ran the suite under coverage wrote, so the plan
      # runs no suite of its own (ADR-0006).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-map
        if: inputs.coverage != ''
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ inputs.coverage }}
          path: ${{ env.HANDED }}
      - name: Retry downloading the coverage map
        if: steps.download-map.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: ${{ inputs.coverage }}
          path: ${{ env.HANDED }}
      - name: Plan
        id: plan
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
          OPTIONS: ${{ steps.resolve.outputs.plan_options }}
          COVERAGE: ${{ inputs.coverage }}
        run: |
          set -euo pipefail
          mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
          if [ -n "${COVERAGE}" ]; then
            arguments+=("--coverage=${HANDED}")
          fi
          "${GATE}" plan --ci=github --deliver-later "${arguments[@]}"
      # ADR-0106: on a pull request whose plan runs a shard, the jobs the last
      # run's survivors are re-checked in, one per file of those it takes, at
      # most survivorsFirst.shards, and the minutes each may take.
      - name: Share the re-check of the last run's survivors
        id: survivors
        if: github.event_name == 'pull_request' && steps.plan.outputs.shards != '[]'
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
          OPTIONS: ${{ steps.resolve.outputs.options }}
        run: |
          set -euo pipefail
          mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
          jobs="$("${GATE}" survivors --plan=.mutation-gate/plan.json --jobs "${arguments[@]}")"
          echo "shares=$(jq -c .shares <<< "${jobs}")" >> "${GITHUB_OUTPUT}"
          echo "minutes=$(jq .minutes <<< "${jobs}")" >> "${GITHUB_OUTPUT}"
      - name: Say whether the plan left a delivery
        id: delivery
        run: |
          if [ -f "${DELIVERY}/planned/delivery.json" ]; then
            echo "left=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-gate-plan-${{ github.run_attempt }}
          path: .mutation-gate/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      # One artifact of the plan's whole coverage map and every shard's: each
      # shard keeps its own, which holds only the lines of that shard's files,
      # and the whole map, which its runner reads only to find the tests that
      # run a line reading a mutated value (ADR-0006). The runner's own files
      # beside them are this job's, and stay here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-gate-coverage-${{ github.run_attempt }}
          path: |
            .mutation-gate/coverage/
            !.mutation-gate/coverage/*.php
            !.mutation-gate/coverage/*.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.delivery.outputs.left == 'true'
        with:
          name: mutation-gate-delivery-plan-${{ github.run_attempt }}
          path: ${{ env.DELIVERY }}/planned
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The pull request comment's planned state, which the plan left in its
  # delivery, posted while the shards run. It installs and runs none of the
  # project's code, and holds the token that may comment and no secret.
  deliver-plan:
    name: deliver plan
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.delivery == 'true' }}
    runs-on: ${{ startsWith(inputs.keyed-runs-on, '[') && fromJSON(inputs.keyed-runs-on) || inputs.keyed-runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.GATE_ACTION }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          ini-values: ${{ inputs.ini-values }}
          coverage: none
      - name: Install the gate
        run: bash "${GATE_ACTION}/resources/action/install.sh" "${GATE_ACTION}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-delivery
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: mutation-gate-delivery-plan-${{ needs.plan.outputs.attempt }}
          path: ${{ env.DELIVERY }}/planned
      - name: Retry downloading the plan's delivery
        if: steps.download-delivery.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: mutation-gate-delivery-plan-${{ needs.plan.outputs.attempt }}
          path: ${{ env.DELIVERY }}/planned
      - name: Deliver
        id: deliver
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: php "${GATE_ACTION}/bin/mutation-gate" deliver --from="${DELIVERY}/planned"

  shard:
    name: shard ${{ matrix.shard.id }} (${{ matrix.shard.label }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.shards != '[]' }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.shard-timeout }}
    permissions:
      contents: read
    # ADR-0103: a doomed shard fails as `run.failFast` says; under `cancel`
    # the matrix cancels the other shards, with no token in this job.
    strategy:
      fail-fast: ${{ needs.plan.outputs.fail-fast == 'cancel' && contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.GATE_ACTION }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-plan
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: mutation-gate-plan-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate
      - name: Retry downloading the plan
        if: steps.download-plan.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: mutation-gate-plan-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-coverage
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: mutation-gate-coverage-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate/coverage
      - name: Retry downloading the plan's coverage maps
        if: steps.download-coverage.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: mutation-gate-coverage-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate/coverage
      - name: Keep only this shard's coverage map and the whole map
        env:
          SHARD: ${{ matrix.shard.id }}
        run: |
          set -euo pipefail
          find .mutation-gate/coverage -mindepth 1 -maxdepth 1 -type d ! -name "shard-${SHARD}" -exec rm -rf {} +
      # The action as this workflow's own commit holds it, checked out above
      # into the caller's workspace: `$/` would name the caller's repository.
      - uses: ./.mutation-gate/workflow # zizmor: ignore[self-repository]
        with:
          config: ${{ inputs.config }}
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          ini-values: ${{ inputs.ini-values }}
          runner: ${{ inputs.runner }}
          shard: ${{ matrix.shard.id }}
          mode: ${{ inputs.mode }}
          changed-since: ${{ inputs.changed-since }}
          budget: ${{ inputs.budget }}
          reports: ${{ inputs.reports }}
          cache: ${{ inputs.cache }}
          install: composer
          composer-auth: ${{ secrets.COMPOSER_AUTH }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-gate-result-${{ needs.plan.outputs.attempt }}-${{ matrix.shard.id }}
          path: |
            .mutation-gate/results/${{ matrix.shard.id }}.json
            .mutation-gate/results/${{ matrix.shard.id }}.attempt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # On a pull request whose plan runs a shard, the last run's survivors run
  # again beside the shards, for a signal within minutes (ADR-0020; ADR-0062),
  # shared among the jobs the plan names, each taking its share of their files
  # within survivorsFirst.budget and leaving what it made (ADR-0106). It runs
  # the project's code, as a shard does, so it holds no secret and no token.
  # It writes no ledger; the verdict judges nothing it found.
  survivors:
    name: survivors ${{ matrix.share }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name == 'pull_request' && needs.plan.outputs.survivor-shares != '' && needs.plan.outputs.survivor-shares != '[]' && needs.plan.outputs.shards != '[]' }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.survivor-minutes) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        share: ${{ fromJSON(needs.plan.outputs.survivor-shares) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.GATE_ACTION }}
          persist-credentials: false
      - name: Refuse an event the gate never runs under
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" guard
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          ini-values: ${{ inputs.ini-values }}
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - name: Resolve the run
        id: resolve
        env:
          MODE: ${{ inputs.mode }}
          CHANGED_SINCE: ${{ inputs.changed-since }}
          CONFIG: ${{ inputs.config }}
          RUNNER: ${{ inputs.runner }}
          BUDGET: ${{ inputs.budget }}
          REPORTS: ${{ inputs.reports }}
          CACHE: ${{ inputs.cache }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH }}
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" resolve
      - name: Read the effective config
        id: config
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
          OPTIONS: ${{ steps.resolve.outputs.options }}
          CACHE: ${{ inputs.cache }}
        run: |
          set -euo pipefail
          mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
          "${GATE}" config:show --format=json --resolved "${arguments[@]}" \
            | python3 "${GATE_ACTION}/resources/action/gate_action.py" config
      # ADR-0004: with pest.patch on, a mutation run refuses an unpatched
      # pest-plugin-mutate, so this job patches the vendor directory it
      # installed, as the action does for a shard.
      - name: Apply the optional Pest patches
        if: steps.config.outputs.pest_patch == 'true'
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
        run: '"${GATE}" pest:patch'
      # ADR-0004: Infection gives each mutant its own limit until
      # infection:patch gives it the gate's, so this job patches the vendor
      # directory it installed, as the action does for a shard: a release it
      # does not patch runs unpatched with a warning, and one it cannot patch
      # fails the step.
      - name: Apply the Infection patch
        if: steps.config.outputs.infection_patch == 'true'
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
        run: |
          set -uo pipefail
          said="${RUNNER_TEMP}/infection-patch.txt"
          code=0
          "${GATE}" infection:patch 2> "${said}" || code=$?
          cat "${said}" >&2
          CODE="${code}" SAID="${said}" python3 "${GATE_ACTION}/resources/action/gate_action.py" infection
      # The branch's own ledger holds its last run's survivors.
      - name: Restore this scope's ledger
        if: steps.config.outputs.default_store == 'true' && steps.resolve.outputs.own_dir != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.resolve.outputs.own_dir }}
          key: ${{ steps.resolve.outputs.own_prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.resolve.outputs.own_prefix }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-plan
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: mutation-gate-plan-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate
      - name: Retry downloading the plan
        if: steps.download-plan.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: mutation-gate-plan-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate
      # The re-check judges each timeout, kill and mutant out of memory by its
      # unmutated control, timed from the map the plan made (ADR-0008), as a
      # shard does.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-coverage
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: mutation-gate-coverage-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate/coverage
      - name: Retry downloading the plan's coverage maps
        if: steps.download-coverage.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: mutation-gate-coverage-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate/coverage
      - name: Re-check this share of the last run's survivors
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
          OPTIONS: ${{ steps.resolve.outputs.options }}
          SHARE: ${{ matrix.share }}
          OF: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
          "${GATE}" survivors --plan=.mutation-gate/plan.json --share="${SHARE}" --of="${OF}" "${arguments[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-gate-survivors-${{ needs.plan.outputs.attempt }}-${{ matrix.share }}
          path: .mutation-gate/survivors/${{ matrix.share }}.json
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 1

  # The re-check's shares, paired again with the survivors they were taken
  # for, a share that left nothing read as not reached, and the comment's
  # "survivors re-checked" state left for deliver-survivors (ADR-0106). It
  # runs the project's code to read the config and the plan, and holds no
  # secret and no token.
  survivors-report:
    name: survivors report
    needs: [plan, survivors]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.survivors.result != 'skipped' }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      delivery: ${{ steps.delivery.outputs.left }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.GATE_ACTION }}
          persist-credentials: false
      - name: Refuse an event the gate never runs under
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" guard
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - name: Resolve the run
        id: resolve
        env:
          MODE: ${{ inputs.mode }}
          CHANGED_SINCE: ${{ inputs.changed-since }}
          CONFIG: ${{ inputs.config }}
          RUNNER: ${{ inputs.runner }}
          BUDGET: ${{ inputs.budget }}
          REPORTS: ${{ inputs.reports }}
          CACHE: ${{ inputs.cache }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH }}
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" resolve
      - name: Read the effective config
        id: config
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
          OPTIONS: ${{ steps.resolve.outputs.options }}
          CACHE: ${{ inputs.cache }}
        run: |
          set -euo pipefail
          mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
          "${GATE}" config:show --format=json --resolved "${arguments[@]}" \
            | python3 "${GATE_ACTION}/resources/action/gate_action.py" config
      # The branch's own ledger holds its last run's survivors.
      - name: Restore this scope's ledger
        if: steps.config.outputs.default_store == 'true' && steps.resolve.outputs.own_dir != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.resolve.outputs.own_dir }}
          key: ${{ steps.resolve.outputs.own_prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.resolve.outputs.own_prefix }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-plan
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: mutation-gate-plan-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate
      - name: Retry downloading the plan
        if: steps.download-plan.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: mutation-gate-plan-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-shares
        timeout-minutes: 2
        continue-on-error: true
        with:
          pattern: mutation-gate-survivors-${{ needs.plan.outputs.attempt }}-*
          path: .mutation-gate/survivors
          merge-multiple: true
      - name: Retry downloading what the survivors' shares made
        if: steps.download-shares.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          pattern: mutation-gate-survivors-${{ needs.plan.outputs.attempt }}-*
          path: .mutation-gate/survivors
          merge-multiple: true
      - name: Report the re-check of the last run's survivors
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
          OPTIONS: ${{ steps.resolve.outputs.options }}
          SHARES: ${{ needs.plan.outputs.survivor-shares }}
        run: |
          set -euo pipefail
          mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
          "${GATE}" survivors --plan=.mutation-gate/plan.json --from=.mutation-gate/survivors \
            --of="$(jq length <<< "${SHARES}")" --deliver-later "${arguments[@]}"
      - name: Say whether the re-check left a delivery
        id: delivery
        run: |
          if [ -f "${DELIVERY}/survivors/delivery.json" ]; then
            echo "left=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.delivery.outputs.left == 'true'
        with:
          name: mutation-gate-delivery-survivors-${{ github.run_attempt }}
          path: ${{ env.DELIVERY }}/survivors
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The comment's "survivors re-checked" state, which survivors-report left,
  # written only over its planned state, so the verdict's is never replaced.
  # It installs and runs none of the project's code, and holds the token that
  # may comment and no secret.
  deliver-survivors:
    name: deliver survivors
    needs: survivors-report
    if: ${{ !cancelled() && needs.survivors-report.result == 'success' && needs.survivors-report.outputs.delivery == 'true' }}
    runs-on: ${{ startsWith(inputs.keyed-runs-on, '[') && fromJSON(inputs.keyed-runs-on) || inputs.keyed-runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.GATE_ACTION }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          ini-values: ${{ inputs.ini-values }}
          coverage: none
      - name: Install the gate
        run: bash "${GATE_ACTION}/resources/action/install.sh" "${GATE_ACTION}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-delivery
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: mutation-gate-delivery-survivors-${{ needs.survivors-report.outputs.attempt }}
          path: ${{ env.DELIVERY }}/survivors
      - name: Retry downloading the survivors' delivery
        if: steps.download-delivery.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: mutation-gate-delivery-survivors-${{ needs.survivors-report.outputs.attempt }}
          path: ${{ env.DELIVERY }}/survivors
      - name: Deliver
        id: deliver
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: php "${GATE_ACTION}/bin/mutation-gate" deliver --from="${DELIVERY}/survivors"

  # The check a branch protects, shown as `<calling job> / verdict`. It runs
  # whenever the run was not cancelled, whatever the plan and the shards did:
  # GitHub passes a required check that was skipped. A plan that could not
  # judge makes it cannot-judge, and so does a shard that left no result.
  verdict:
    name: verdict
    needs: [fetch, plan, shard, survivors, survivors-report]
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.verdict-timeout }}
    permissions:
      contents: read
      actions: read
    outputs:
      verdict: ${{ steps.outputs.outputs.verdict || steps.unplanned.outputs.verdict }}
      scores: ${{ steps.outputs.outputs.scores }}
      delivery: ${{ steps.delivery.outputs.left }}
      attempt: ${{ github.run_attempt }}
      kept-after-store: ${{ steps.resolve.outputs.save == 'true' && steps.config.outputs.default_store == 'true' && steps.config.outputs.after_store == 'true' && steps.verdict.outputs.code != '' }}
      ledger-dir: ${{ steps.resolve.outputs.own_dir }}
      ledger-prefix: ${{ steps.resolve.outputs.own_prefix }}
    steps:
      - name: Refuse a run whose plan could not judge
        id: unplanned
        if: needs.plan.result != 'success'
        env:
          PLAN: ${{ needs.plan.result }}
        run: |
          echo "verdict=cannot-judge" >> "${GITHUB_OUTPUT}"
          echo "::error::The plan job ended ${PLAN}, so there is nothing to judge: the gate cannot judge this run. See the plan job."
          exit 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.GATE_ACTION }}
          persist-credentials: false
      - name: Refuse an event the gate never runs under
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" guard
      # The two steps that hold the token come before the project's
      # dependencies install, so none of its code runs while one does. This
      # one also lists this attempt's jobs, for the `stale` step, and keeps
      # the error lines of the log of each that was cancelled or failed, for
      # the `ended` step.
      - name: Name the default branch and list this attempt's jobs
        id: default
        env:
          NAMED: ${{ github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH }}
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
        run: |
          set -euo pipefail
          if [ -z "${NAMED}" ]; then
            NAMED="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          fi
          echo "name=${NAMED}" >> "${GITHUB_OUTPUT}"
          gh api --paginate "${JOBS}?per_page=100" --jq '.jobs[]' | jq -s . > .mutation-gate/jobs.json
          mkdir -p "${ERRORS}"
          jq -r '.[] | select(.conclusion == "cancelled" or .conclusion == "failure") | .id' .mutation-gate/jobs.json \
            | while read -r job; do
                gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job}/logs" 2>/dev/null \
                  | grep -F '##[error]' > "${ERRORS}/${job}.txt" || true
              done
      # The trend appends to what was published last time (ADR-0009).
      - name: Restore what was published last time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .mutation-gate/publish
          for file in badge.json trend.json trend.svg savings.json; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${PUBLISHED}" \
              -H 'Accept: application/vnd.github.raw' > ".mutation-gate/publish/${file}" 2>/dev/null \
              || rm -f ".mutation-gate/publish/${file}"
          done
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          ini-values: ${{ inputs.ini-values }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - name: Resolve the run
        id: resolve
        env:
          MODE: ${{ inputs.mode }}
          CHANGED_SINCE: ${{ inputs.changed-since }}
          CONFIG: ${{ inputs.config }}
          RUNNER: ${{ inputs.runner }}
          BUDGET: ${{ inputs.budget }}
          REPORTS: ${{ inputs.reports }}
          CACHE: ${{ inputs.cache }}
          DEFAULT_BRANCH: ${{ steps.default.outputs.name }}
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" resolve
      - name: Read the effective config
        id: config
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
          OPTIONS: ${{ steps.resolve.outputs.options }}
          CACHE: ${{ inputs.cache }}
          STORE: ${{ vars.MUTATION_GATE_STORE }}
          ON_DEFAULT: ${{ steps.resolve.outputs.default_dir == '' }}
        run: |
          set -euo pipefail
          mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
          "${GATE}" config:show --format=json --resolved "${arguments[@]}" \
            | python3 "${GATE_ACTION}/resources/action/gate_action.py" config
      - name: Restore this scope's ledger
        id: own
        if: steps.config.outputs.default_store == 'true' && steps.resolve.outputs.own_dir != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.resolve.outputs.own_dir }}
          key: ${{ steps.resolve.outputs.own_prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.resolve.outputs.own_prefix }}
      - name: Restore the default branch's ledger
        if: steps.config.outputs.default_store == 'true' && steps.resolve.outputs.default_dir != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.resolve.outputs.default_dir }}
          key: ${{ steps.resolve.outputs.default_prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.resolve.outputs.default_prefix }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-plan
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: mutation-gate-plan-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate
      - name: Retry downloading the plan
        if: steps.download-plan.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: mutation-gate-plan-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-results
        if: needs.plan.outputs.shards != '[]'
        timeout-minutes: 2
        continue-on-error: true
        with:
          pattern: mutation-gate-result-${{ needs.plan.outputs.attempt }}-*
          path: .mutation-gate/results
          merge-multiple: true
      - name: Retry downloading the shards' results
        if: steps.download-results.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        continue-on-error: true
        with:
          pattern: mutation-gate-result-${{ needs.plan.outputs.attempt }}-*
          path: .mutation-gate/results
          merge-multiple: true
      - name: Remove each result an earlier attempt wrote for a shard run again
        if: needs.plan.outputs.shards != '[]'
        env:
          JOBS: .mutation-gate/jobs.json
          RESULTS: .mutation-gate/results
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" stale
      # Where a shard left no result, how its job ended, which the verdict
      # names: its runner shut down or lost, the matrix cancelling it once
      # another shard failed, its time limit, or a failure.
      - name: Say how each shard that left no result ended
        if: needs.plan.outputs.shards != '[]'
        env:
          JOBS: .mutation-gate/jobs.json
          RESULTS: .mutation-gate/results
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" ended
      # Every map the plan wrote: the verdict builds the kill matrix over its
      # own and learns each shard's timings by the map that shard was handed,
      # unless a verdict that passed stands for the plan (ADR-0062).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-coverage
        if: needs.plan.outputs.stands != 'true'
        timeout-minutes: 2
        continue-on-error: true
        with:
          pattern: mutation-gate-coverage-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate/coverage
          merge-multiple: true
      - name: Retry downloading the plan's coverage maps
        if: steps.download-coverage.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          pattern: mutation-gate-coverage-${{ needs.plan.outputs.attempt }}
          path: .mutation-gate/coverage
          merge-multiple: true
      # The store's copy of the ledger fetch read, as the plan reads it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-fetched
        timeout-minutes: 2
        continue-on-error: true
        with:
          pattern: mutation-gate-fetched-${{ needs.fetch.outputs.attempt }}
          path: ${{ env.FETCHED }}
          merge-multiple: true
      - name: Retry downloading the store's copy of the ledger
        if: steps.download-fetched.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          pattern: mutation-gate-fetched-${{ needs.fetch.outputs.attempt }}
          path: ${{ env.FETCHED }}
          merge-multiple: true
      # What the run's jobs took, from the list the first step read (ADR-0017).
      - name: Read what the run's jobs took
        env:
          JOBS: .mutation-gate/jobs.json
          RUN_TIMES: .mutation-gate/run-times.json
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" run-times
      # The comment, the ledger, the alerts and the trace go into the delivery,
      # which the deliver job sends: this step holds no secret and no token.
      - name: Verdict
        id: verdict
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
          OPTIONS: ${{ steps.resolve.outputs.options }}
          ACTION_REPORTS: ${{ steps.config.outputs.action_reports }}
        run: |
          set -uo pipefail
          code=0
          mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
          mapfile -t reports < <(jq -r '.[]' <<< "${ACTION_REPORTS}")
          "${GATE}" verdict --plan=.mutation-gate/plan.json --results=.mutation-gate/results \
            "${reports[@]}" --deliver-later "${arguments[@]}" || code=$?
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
      # The verdict leaves this scope's ledger and kept coverage map in its
      # delivery; the directory store is this cache, which needs no key, so
      # they are kept here for this scope's ref alone (ADR-0007), unless
      # deliver keeps them after the store (ADR-0061).
      - name: Keep this scope's ledger
        if: >-
          steps.resolve.outputs.save == 'true' && steps.config.outputs.default_store == 'true'
          && steps.verdict.outputs.code != ''
          && steps.config.outputs.after_store != 'true'
        uses: ./.mutation-gate/workflow/resources/action/keep # zizmor: ignore[self-repository]
        with:
          from: ${{ env.DELIVERY }}/verdict
          directory: ${{ steps.resolve.outputs.own_dir }}
          prefix: ${{ steps.resolve.outputs.own_prefix }}
          matched: ${{ steps.own.outputs.cache-matched-key }}
      # The pass alone, which the push that merges this pull request reads where
      # this run's cache cannot reach it. A fork's run keeps nothing (ADR-0139).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          inputs.merged-records && github.event_name == 'pull_request' && steps.verdict.outputs.code == '0'
          && steps.resolve.outputs.save == 'true'
        with:
          name: mutation-gate-passed
          path: ${{ env.DELIVERY }}/verdict/passed.ledger.json.gz
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.merged-records-days }}
      - name: Say what the gate decided
        id: outputs
        env:
          EXIT_CODE: ${{ steps.verdict.outputs.code || '2' }}
          REPORT: .mutation-gate/action/report.json
          REPORTS: ${{ inputs.reports }}
          PLAN: ''
        run: python3 "${GATE_ACTION}/resources/action/gate_action.py" outputs
      - name: Say whether the verdict left a delivery
        id: delivery
        if: ${{ !cancelled() && steps.verdict.outputs.code != '' }}
        run: |
          if [ -f "${DELIVERY}/verdict/delivery.json" ]; then
            echo "left=true" >> "${GITHUB_OUTPUT}"
          fi
      # The HTML report, unarchived under the name the comment's link finds it
      # by, so the link opens the page itself; deliver runs after this job.
      - name: Name the HTML report as the comment links it
        if: ${{ !cancelled() && hashFiles('.mutation-gate/action/html/index.html') != '' }}
        run: cp .mutation-gate/action/html/index.html .mutation-gate/action/mutation-gate-report.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('.mutation-gate/action/mutation-gate-report.html') != '' }}
        with:
          path: .mutation-gate/action/mutation-gate-report.html
          archive: false
          include-hidden-files: true
          if-no-files-found: ignore
      # The digest, the verdict one fact a line for an agent, beside the page.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('.mutation-gate/action/mutation-gate-digest.txt') != '' }}
        with:
          path: .mutation-gate/action/mutation-gate-digest.txt
          archive: false
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.outputs.outputs.report_files != '' }}
        with:
          name: mutation-gate-reports
          path: ${{ steps.outputs.outputs.report_files }}
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-gate-publish-${{ github.run_attempt }}
          path: .mutation-gate/publish
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.delivery.outputs.left == 'true' }}
        with:
          name: mutation-gate-delivery-${{ github.run_attempt }}
          path: ${{ env.DELIVERY }}/verdict
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Fail unless the gate passed
        env:
          CODE: ${{ steps.verdict.outputs.code || '2' }}
        run: exit "${CODE}"

  # What the verdict left for a credential: the comment on every run, and on a
  # trusted run, a push, schedule or dispatch on the default branch, the ledger
  # written to the store, the alerts and the trace. Only a trusted run enters
  # the environment mutation-gate-store, whose deployment-branch policy admits
  # the default branch alone, so GitHub holds the line even where a branch
  # rewrites the workflow. The trust is read from github.* and vars.* alone,
  # never from an input. The job installs and runs none of the project's code:
  # it runs the gate from its own installation at this workflow's commit, and
  # the store's whole location comes from the repository's variables, never
  # from the delivery (ADR-0007).
  deliver:
    name: deliver
    environment:
      name: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) != '' && github.ref == format('refs/heads/{0}', (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH))) && 'mutation-gate-store' || '' }}
      deployment: false
    needs: verdict
    if: ${{ !cancelled() && contains(fromJSON('["success","failure"]'), needs.verdict.result) && needs.verdict.outputs.delivery == 'true' }}
    runs-on: ${{ startsWith(inputs.keyed-runs-on, '[') && fromJSON(inputs.keyed-runs-on) || inputs.keyed-runs-on }}
    timeout-minutes: 15
    # id-token: write, as fetch has it, for a store that signs in through
    # GitHub's OIDC; actions: read, to find the HTML report the comment links.
    permissions:
      contents: read
      actions: read
      pull-requests: write
      id-token: write
    steps:
      - name: Say why this run holds no secrets
        if: ${{ contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) == '' }}
        env:
          EVENT: ${{ github.event_name }}
        run: >-
          echo "This ${EVENT} run holds no secrets: GitHub gave it no default branch name, and the
          repository variable MUTATION_GATE_DEFAULT_BRANCH is not set. Set that variable to the default
          branch's name, and these runs enter the environment mutation-gate-store." >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.GATE_ACTION }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          ini-values: ${{ inputs.ini-values }}
          coverage: none
      - name: Install the gate
        run: bash "${GATE_ACTION}/resources/action/install.sh" "${GATE_ACTION}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-delivery
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: mutation-gate-delivery-${{ needs.verdict.outputs.attempt }}
          path: ${{ env.DELIVERY }}/verdict
      - name: Retry downloading the verdict's delivery
        if: steps.download-delivery.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: mutation-gate-delivery-${{ needs.verdict.outputs.attempt }}
          path: ${{ env.DELIVERY }}/verdict
      - name: Deliver
        id: deliver
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MUTATION_GATE_DEFAULT_BRANCH: ${{ vars.MUTATION_GATE_DEFAULT_BRANCH }}
          MUTATION_GATE_STORE: ${{ vars.MUTATION_GATE_STORE }}
          MUTATION_GATE_STORE_BUCKET: ${{ vars.MUTATION_GATE_STORE_BUCKET }}
          MUTATION_GATE_STORE_PREFIX: ${{ vars.MUTATION_GATE_STORE_PREFIX }}
          MUTATION_GATE_STORE_REGION: ${{ vars.MUTATION_GATE_STORE_REGION }}
          MUTATION_GATE_STORE_ENDPOINT: ${{ vars.MUTATION_GATE_STORE_ENDPOINT }}
          MUTATION_GATE_STORE_ACCOUNT: ${{ vars.MUTATION_GATE_STORE_ACCOUNT }}
          MUTATION_GATE_STORE_CONTAINER: ${{ vars.MUTATION_GATE_STORE_CONTAINER }}
          MUTATION_GATE_STORE_PUBLIC_CONTAINER: ${{ vars.MUTATION_GATE_STORE_PUBLIC_CONTAINER }}
          AWS_ACCESS_KEY_ID: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) != '' && github.ref == format('refs/heads/{0}', (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH))) && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) != '' && github.ref == format('refs/heads/{0}', (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH))) && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AWS_SESSION_TOKEN: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) != '' && github.ref == format('refs/heads/{0}', (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH))) && secrets.AWS_SESSION_TOKEN || '' }}
          MUTATION_GATE_SLACK_URL: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) != '' && github.ref == format('refs/heads/{0}', (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH))) && secrets.MUTATION_GATE_SLACK_URL || '' }}
          MUTATION_GATE_DISCORD_URL: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) != '' && github.ref == format('refs/heads/{0}', (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH))) && secrets.MUTATION_GATE_DISCORD_URL || '' }}
          MUTATION_GATE_WEBHOOK_URL: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) != '' && github.ref == format('refs/heads/{0}', (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH))) && secrets.MUTATION_GATE_WEBHOOK_URL || '' }}
          MUTATION_GATE_WEBHOOK_SECRET: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) != '' && github.ref == format('refs/heads/{0}', (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH))) && secrets.MUTATION_GATE_WEBHOOK_SECRET || '' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) != '' && github.ref == format('refs/heads/{0}', (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH))) && secrets.OTEL_EXPORTER_OTLP_ENDPOINT || '' }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) != '' && github.ref == format('refs/heads/{0}', (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH))) && secrets.OTEL_EXPORTER_OTLP_HEADERS || '' }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          MUTATION_GATE_GCS_PROVIDER: ${{ vars.MUTATION_GATE_GCS_PROVIDER }}
          MUTATION_GATE_GCS_SERVICE_ACCOUNT: ${{ vars.MUTATION_GATE_GCS_SERVICE_ACCOUNT }}
        run: php "${GATE_ACTION}/bin/mutation-gate" deliver --from="${DELIVERY}/verdict"
      # With proofs.copies `together`, the cache follows the store (ADR-0061).
      - name: Keep the ledger the store now holds
        if: needs.verdict.outputs.kept-after-store == 'true' && steps.deliver.outcome == 'success'
        uses: ./.mutation-gate/workflow/resources/action/keep # zizmor: ignore[self-repository]
        with:
          from: ${{ env.DELIVERY }}/verdict
          directory: ${{ needs.verdict.outputs.ledger-dir }}
          prefix: ${{ needs.verdict.outputs.ledger-prefix }}

  # The badge and the trend, pushed through the contents API to the branch
  # `mutation-gate` with this job's own token, so GitHub signs each commit. It
  # runs only for the default branch itself, and it is the only job that may
  # write (ADR-0009).
  publish:
    name: publish
    needs: [plan, verdict]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON('["success","failure"]'), needs.verdict.result) && needs.verdict.outputs.verdict != ''
      && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH) != '' && github.ref == format('refs/heads/{0}', (github.event.repository.default_branch || vars.MUTATION_GATE_DEFAULT_BRANCH))) }}
    runs-on: ${{ startsWith(inputs.keyed-runs-on, '[') && fromJSON(inputs.keyed-runs-on) || inputs.keyed-runs-on }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-publish
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: mutation-gate-publish-${{ needs.verdict.outputs.attempt }}
          path: publish
      - name: Retry downloading what the verdict publishes
        if: steps.download-publish.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          name: mutation-gate-publish-${{ needs.verdict.outputs.attempt }}
          path: publish
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.GATE_ACTION }}
          persist-credentials: false
      - name: Publish the badge and the trend
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: 'chore: publish the mutation score'
        run: bash "${GATE_ACTION}/resources/action/publish.sh"
