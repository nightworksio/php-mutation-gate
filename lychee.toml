# Link checking, for the `links` job in .github/workflows/hygiene.yml.

# Hidden files are read, so the decision records under `.docs` are checked.
# `.git` holds compressed objects rather than documents.
hidden = true
# The vendored viewer, the fixtures and the docs site's packages are other
# projects' files, and its build is the docs again.
exclude_path = [".git", "vendor", "tests/Fixtures", ".site/node_modules", ".site/dist", ".site/.astro"]

exclude_loopback = true
max_retries = 3
retry_wait_time = 3

# What is not a broken link:
#   206  a partial response: the host answered, in pieces
#   429  the host asking to be asked less often
#   5xx  the host is unwell, which says nothing about whether the link is wrong
# A link that is wrong answers 404 or 410, and those still fail.
accept = ["200", "206", "429", "500..=599"]

# The docs site's own pages are checked against its build, by site.yml's link
# test, so a page a pull request adds is checked before it is deployed.
exclude = ['^https://nightworksio\.github\.io/php-mutation-gate/']
