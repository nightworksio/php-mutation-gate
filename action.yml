name: mutation-gate
description: Mutation testing for PHP that runs only what a change reaches, proves what it skips, and fails a pull request that lowers a floor.
author: NightWorksIO

branding:
  icon: shield
  color: green

# Every input is a string, because an action's inputs are: the description
# gives the format of the value (ADR-0011, decision 8).
inputs:
  config:
    description: The config file, where the gate should not look for one.
    required: false
    default: ''
  php-version:
    description: The PHP version to set up.
    required: false
    default: '8.5'
  runner:
    description: pest, infection or a registered runner's name; the config's, or zero-config's, where empty.
    required: false
    default: ''
  shard:
    description: The id of the one shard of `.mutation-gate/plan.json` to run; the whole gate runs where empty.
    required: false
    default: ''
  mode:
    description: changed (change-scoped whatever the event) or full (every unit). No event runs in full unless the mode is full.
    required: false
    default: changed
  changed-since:
    description: A full commit SHA, a fully qualified ref such as refs/tags/v1.2.0, last-passed or last-run; where empty, last-run on pull_request (the commit the pull request's last run judged, falling back to the default branch), the default branch on another branch, and last-passed on a push to the default branch.
    required: false
    default: ''
  budget:
    description: How long the run may take, such as 15m or 1h30m.
    required: false
    default: ''
  reports:
    description: '<name>:<path> lines, each added as --report, such as sarif:build/mutation.sarif.'
    required: false
    default: ''
  cache:
    description: 'true to keep the proof ledger in the Actions cache.'
    required: false
    default: 'true'
  deliver:
    description: >-
      true to send what a run of the action left: the pull request comment, and a store's ledger where the job's
      environment names one. Use it in a job of its own that needs the run's job; it runs none of the project's code.
    required: false
    default: 'false'

outputs:
  verdict:
    description: passed, failed or cannot-judge; empty for one shard, whose verdict comes later.
    value: ${{ steps.outputs.outputs.verdict }}
  scores:
    description: 'JSON: each tree''s score, and the new code''s.'
    value: ${{ steps.outputs.outputs.scores }}
  report-paths:
    description: 'JSON: each written report''s name and path.'
    value: ${{ steps.outputs.outputs.report_paths }}
  plan:
    description: 'JSON: the plan, as plan --ci=json prints it.'
    value: ${{ steps.outputs.outputs.plan }}

runs:
  using: composite
  steps:
    # C2.1: an event that runs the default branch's workflow with write access
    # over a pull request's content is refused before anything is installed.
    - name: Refuse an event the gate never runs under
      shell: bash
      run: python3 "${GITHUB_ACTION_PATH}/resources/action/gate_action.py" guard

    - name: Set up PHP
      if: inputs.deliver != 'true'
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: pcov

    # Before the project's dependencies install, so none of its code runs
    # while a step holds the token.
    - name: Name the default branch
      id: default
      if: inputs.deliver != 'true'
      shell: bash
      env:
        NAMED: ${{ github.event.repository.default_branch }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ -z "${NAMED}" ]; then
          NAMED="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
        fi
        echo "name=${NAMED}" >> "${GITHUB_OUTPUT}"

    - name: Install the project's dependencies
      if: inputs.deliver != 'true'
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

    - name: Resolve the run
      id: resolve
      if: inputs.deliver != 'true'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CHANGED_SINCE: ${{ inputs.changed-since }}
        CONFIG: ${{ inputs.config }}
        RUNNER: ${{ inputs.runner }}
        BUDGET: ${{ inputs.budget }}
        REPORTS: ${{ inputs.reports }}
        CACHE: ${{ inputs.cache }}
        DEFAULT_BRANCH: ${{ steps.default.outputs.name }}
      run: python3 "${GITHUB_ACTION_PATH}/resources/action/gate_action.py" resolve

    # ADR-0007: the Actions cache holds the directory store at its default path
    # and nothing else, so a config that keeps its ledger elsewhere runs uncached.
    - name: Read the effective config
      id: config
      if: inputs.deliver != 'true'
      shell: bash
      env:
        GATE: ${{ steps.resolve.outputs.gate }}
        OPTIONS: ${{ steps.resolve.outputs.options }}
        CACHE: ${{ inputs.cache }}
      run: |
        set -euo pipefail
        mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
        "${GATE}" config:show --format=json "${arguments[@]}" \
          | python3 "${GITHUB_ACTION_PATH}/resources/action/gate_action.py" config

    # ADR-0004: with pest.patch on, a mutation run refuses an unpatched
    # pest-plugin-mutate. The action patches the vendor directory this job
    # installed, so the project's Composer hook is for its runs elsewhere.
    - name: Apply the optional Pest patches
      if: inputs.deliver != 'true' && steps.config.outputs.pest_patch == 'true'
      shell: bash
      env:
        GATE: ${{ steps.resolve.outputs.gate }}
      run: '"${GATE}" pest:patch'

    # ADR-0004: Infection gives each mutant its own limit until infection:patch
    # gives it the gate's. The action patches the vendor directory this job
    # installed, so the project's Composer hook is for its runs elsewhere. A
    # release the patch does not patch runs unpatched, with a warning in the
    # log and the step summary; one it cannot patch fails the step.
    - name: Apply the Infection patch
      if: inputs.deliver != 'true' && steps.config.outputs.infection_patch == 'true'
      shell: bash
      env:
        GATE: ${{ steps.resolve.outputs.gate }}
      run: |
        set -uo pipefail
        said="${RUNNER_TEMP}/infection-patch.txt"
        code=0
        "${GATE}" infection:patch 2> "${said}" || code=$?
        cat "${said}" >&2
        CODE="${code}" SAID="${said}" python3 "${GITHUB_ACTION_PATH}/resources/action/gate_action.py" infection

    # A shard of a plan reads no ledger: the plan it runs was made from them.
    - name: Restore this scope's ledger
      id: own
      if: >-
        inputs.deliver != 'true' && inputs.shard == '' && steps.config.outputs.default_store == 'true'
        && steps.resolve.outputs.own_dir != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.own_dir }}
        key: ${{ steps.resolve.outputs.own_prefix }}${{ github.run_id }}
        restore-keys: ${{ steps.resolve.outputs.own_prefix }}

    - name: Restore the default branch's ledger
      if: >-
        inputs.deliver != 'true' && inputs.shard == '' && steps.config.outputs.default_store == 'true'
        && steps.resolve.outputs.default_dir != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.default_dir }}
        key: ${{ steps.resolve.outputs.default_prefix }}${{ github.run_id }}
        restore-keys: ${{ steps.resolve.outputs.default_prefix }}

    # One shard of a plan the reusable workflow made: its result is the verdict's to judge.
    - name: Run shard ${{ inputs.shard }}
      id: shard
      if: inputs.deliver != 'true' && inputs.shard != ''
      shell: bash
      env:
        GATE: ${{ steps.resolve.outputs.gate }}
        OPTIONS: ${{ steps.resolve.outputs.options }}
        SHARD: ${{ inputs.shard }}
      run: |
        set -uo pipefail
        code=0
        mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
        "${GATE}" run --plan=.mutation-gate/plan.json --shard="${SHARD}" --results=.mutation-gate/results "${arguments[@]}" || code=$?
        echo "code=${code}" >> "${GITHUB_OUTPUT}"

    # The whole gate in this job: the plan, each of its shards in turn, then the
    # verdict, the same path the reusable workflow takes across jobs. These
    # steps run the project's code, so none holds a token or a secret: what
    # needs one is left in .mutation-gate/delivery, which a job of its own
    # sends with `deliver: true` (ADR-0007, decision 5).
    - name: Plan
      id: plan
      if: inputs.deliver != 'true' && inputs.shard == ''
      shell: bash
      env:
        GATE: ${{ steps.resolve.outputs.gate }}
        OPTIONS: ${{ steps.resolve.outputs.plan_options }}
      run: |
        set -uo pipefail
        code=0
        mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
        "${GATE}" plan --ci=github --deliver-later "${arguments[@]}" || code=$?
        echo "code=${code}" >> "${GITHUB_OUTPUT}"

    # On a pull request, the last run's survivors run again first, for a
    # signal before every shard has run (ADR-0020, decision 21). It leaves the
    # comment over its planned state alone, and nothing it finds is judged.
    - name: Re-check the last run's survivors
      if: inputs.deliver != 'true' && inputs.shard == '' && steps.plan.outputs.code == '0'
      shell: bash
      env:
        GATE: ${{ steps.resolve.outputs.gate }}
        OPTIONS: ${{ steps.resolve.outputs.options }}
      run: |
        set -uo pipefail
        mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
        "${GATE}" survivors --plan=.mutation-gate/plan.json --deliver-later "${arguments[@]}" \
          || echo "::warning::The last run's survivors could not be re-checked first."

    - name: Run every shard
      id: run
      if: inputs.deliver != 'true' && inputs.shard == '' && steps.plan.outputs.code == '0'
      shell: bash
      env:
        GATE: ${{ steps.resolve.outputs.gate }}
        OPTIONS: ${{ steps.resolve.outputs.options }}
        SHARDS: ${{ steps.plan.outputs.shards }}
      run: |
        set -uo pipefail
        mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
        mapfile -t shards < <(jq -r '.[].id' <<< "${SHARDS:-[]}")
        # Every shard runs, whatever one before it ended with: the verdict
        # judges the result each shard left, and one left none is cannot-judge.
        for shard in "${shards[@]}"; do
          echo "::group::Shard ${shard}"
          "${GATE}" run --plan=.mutation-gate/plan.json --shard="${shard}" --results=.mutation-gate/results "${arguments[@]}" \
            || echo "::warning::Shard ${shard} ended with exit code $?."
          echo "::endgroup::"
        done

    - name: Verdict
      id: verdict
      if: inputs.deliver != 'true' && inputs.shard == '' && steps.plan.outputs.code == '0'
      shell: bash
      env:
        GATE: ${{ steps.resolve.outputs.gate }}
        OPTIONS: ${{ steps.resolve.outputs.options }}
      run: |
        set -uo pipefail
        code=0
        mapfile -t arguments < <(jq -r '.[]' <<< "${OPTIONS}")
        "${GATE}" verdict --plan=.mutation-gate/plan.json --results=.mutation-gate/results \
          --report=json:.mutation-gate/action/report.json --deliver-later "${arguments[@]}" || code=$?
        echo "code=${code}" >> "${GITHUB_OUTPUT}"

    # Only the verdict writes a ledger, and only for the run's own scope where
    # it may write it (ADR-0007): it leaves the ledger and its kept coverage map
    # in its delivery, and the directory store is this cache, which needs no
    # key, so they are kept here for this scope's ref alone. An unchanged
    # ledger has the key it had.
    - name: Keep what the verdict left for this scope
      if: >-
        inputs.deliver != 'true' && inputs.shard == '' && steps.resolve.outputs.save == 'true'
        && steps.config.outputs.default_store == 'true' && steps.verdict.outputs.code != ''
      shell: bash
      env:
        OWN: ${{ steps.resolve.outputs.own_dir }}
      run: |
        set -euo pipefail
        mkdir -p "${OWN}"
        for file in ledger.json.gz coverage.json.gz; do
          if [ -f ".mutation-gate/delivery/verdict/${file}" ]; then
            cp ".mutation-gate/delivery/verdict/${file}" "${OWN}/${file}"
          fi
        done

    - name: Save this scope's ledger
      if: >-
        inputs.deliver != 'true' && inputs.shard == '' && steps.resolve.outputs.save == 'true'
        && steps.config.outputs.default_store == 'true' && steps.verdict.outputs.code != ''
        && hashFiles(format('{0}/ledger.json.gz', steps.resolve.outputs.own_dir), format('{0}/coverage.json.gz', steps.resolve.outputs.own_dir)) != ''
        && format('{0}{1}', steps.resolve.outputs.own_prefix, hashFiles(format('{0}/ledger.json.gz', steps.resolve.outputs.own_dir), format('{0}/coverage.json.gz', steps.resolve.outputs.own_dir))) != steps.own.outputs.cache-matched-key
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.own_dir }}
        key: ${{ steps.resolve.outputs.own_prefix }}${{ hashFiles(format('{0}/ledger.json.gz', steps.resolve.outputs.own_dir), format('{0}/coverage.json.gz', steps.resolve.outputs.own_dir)) }}

    # What the plan, the re-check and the verdict left for a credential, for
    # the job that runs this action with `deliver: true`.
    - name: Hand on what needs a credential
      if: ${{ !cancelled() && inputs.deliver != 'true' && inputs.shard == '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mutation-gate-delivery
        path: .mutation-gate/delivery
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 1

    - name: Say what the gate decided
      id: outputs
      if: inputs.deliver != 'true' && inputs.shard == ''
      shell: bash
      env:
        EXIT_CODE: ${{ steps.verdict.outputs.code || steps.plan.outputs.code || '2' }}
        REPORT: .mutation-gate/action/report.json
        REPORTS: ${{ inputs.reports }}
        PLAN: ${{ steps.plan.outputs.plan }}
      run: python3 "${GITHUB_ACTION_PATH}/resources/action/gate_action.py" outputs

    - name: Fail unless the gate passed
      if: inputs.deliver != 'true'
      shell: bash
      env:
        CODE: ${{ inputs.shard != '' && steps.shard.outputs.code || steps.verdict.outputs.code || steps.plan.outputs.code || '2' }}
      run: exit "${CODE}"

    # `deliver: true`: a job of its own, after the run's, that runs none of
    # the project's code. It installs the gate's own copy at the action's path
    # from the gate's own lock, never the project's vendor, which a pull
    # request controls, and sends each stage's delivery with the token. A
    # step after the project's code in one job could not hold it: that code
    # can change what every later step of its job runs (ADR-0007, decision 5).
    - name: Set up PHP to deliver
      if: inputs.deliver == 'true'
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none

    - name: Install the gate's own copy
      if: inputs.deliver == 'true'
      shell: bash
      run: composer install --working-dir="${GITHUB_ACTION_PATH}" --no-dev --no-scripts --no-plugins --no-interaction --no-progress --prefer-dist

    # A run that stopped before it left anything uploaded nothing, and then
    # there is nothing to deliver.
    - name: Take what the run left
      if: inputs.deliver == 'true'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: mutation-gate-delivery
        path: .mutation-gate/delivery

    - name: Deliver
      if: inputs.deliver == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        code=0
        for stage in planned survivors verdict; do
          if [ -f ".mutation-gate/delivery/${stage}/delivery.json" ]; then
            php "${GITHUB_ACTION_PATH}/bin/mutation-gate" deliver --from=".mutation-gate/delivery/${stage}" || code=$?
          fi
        done
        exit "${code}"
